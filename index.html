<title>카카오톡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* 손님이 글씨를 길게 눌러도 드래그·선택·복사·검색 메뉴가 뜨지 않게 한다.
     (관리자 입력칸과 진단 결과는 예외로 선택 가능) */
  #phone { -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none; }
  #phone input, #phone textarea, #phone select, #phone #diagOut, #phone .kv {
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text; }
  #phone img { -webkit-user-drag:none; user-drag:none; -webkit-touch-callout:none; }
  html,body { height:100%; overscroll-behavior:none; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
    background:#333;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* 폰 프레임 */
  #phone {
    --safe-b: 0px;
    width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px;
    background:#b2c7d9; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.4);
  }

  /* 헤더 */
  .header {
    height:52px; flex-shrink:0; display:flex; align-items:center;
    padding:0 8px; position:relative;
  }
  .header .back { width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    font-size:24px; color:#3a3a3a; cursor:pointer; border:none; background:none; }
  .header .title { flex:1; font-size:18px; font-weight:700; color:#1a1a1a; padding-left:4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
  .header .actions { display:flex; gap:4px; }
  .header .actions button { width:40px; height:40px; border:none; background:none; cursor:pointer;
    font-size:20px; color:#3a3a3a; }

  /* 리스트 화면 배경은 흰색 */
  .screen { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #listScreen { background:#fff; display:flex; flex-direction:column; overflow:hidden; }
  #listScreen .header { background:#fff; flex-shrink:0; }
  #chatList { flex:1; overflow-y:auto; min-height:0; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  /* 하단 탭바 (장식용) */
  .tabbar { flex-shrink:0; background:#fff; border-top:1px solid #eef0f2;
    display:flex; align-items:stretch; padding-bottom:calc(var(--safe-b));padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--safe-b)); }
  .tab { flex:1; display:flex; align-items:center; justify-content:center; color:#bcc2c8;
    min-height:56px; }
  .tab.active { color:#191919; }
  .tab svg { width:27px; height:27px; display:block; }
  .tab-ico { position:relative; display:flex; }
  .tab-badge { position:absolute; top:-5px; left:15px; background:#ff3b30; color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:999px; padding:0 5px;
    font-family:Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    display:inline-flex; align-items:center; justify-content:center; line-height:1; box-sizing:border-box; }
  .tab-badge.hidden { display:none; }

  /* 채팅방 목록 */
  .chat-item { display:flex; align-items:center; padding:11px 16px; cursor:pointer; }
  .chat-item:active { background:#f0f0f0; }
  .avatar { width:50px; height:50px; border-radius:18px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
    font-size:18px; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; }

  /* 단톡방 프로필: 둥근 사각형을 사람 수에 맞춰 분할 (카카오톡 방식) */
  .avatar.grp { display:grid; gap:1.5px; background:#fff; }
  .avatar.grp.n1 { grid-template-columns:1fr; }
  .avatar.grp.n2 { grid-template-columns:1fr 1fr; }
  .avatar.grp.n3, .avatar.grp.n4 { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .avatar.grp.n3 .cell:first-child { grid-row:span 2; }
  .avatar.grp .cell { overflow:hidden; background:#dfe3e8; min-width:0; min-height:0; }
  .avatar.grp .cell img, .avatar.grp .cell svg { width:100%; height:100%; object-fit:cover; display:block; }

  .chat-meta { flex:1; min-width:0; margin-left:12px; }
  .chat-name-row { display:flex; align-items:baseline; }
  .chat-name { font-size:16px; font-weight:600; color:#1a1a1a;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-count { font-size:13px; color:#8a8a8a; margin-left:5px; flex-shrink:0; }
  .chat-preview { font-size:13.5px; color:#8a8a8a; margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-right { text-align:right; margin-left:8px; flex-shrink:0; display:flex; flex-direction:column;
    align-items:flex-end; gap:5px; }
  .chat-time { font-size:11.5px; color:#b0b0b0; }
  /* 안읽음 뱃지 — 기기(한글 기본 글꼴)마다 숫자가 위아래로 치우치지 않도록
     숫자 전용 글꼴 + line-height:1 + flex 중앙 정렬로 고정한다 */
  .badge { background:#ff3b30; color:#fff; font-size:11px; font-weight:700;
    font-family:Roboto, "Helvetica Neue", Arial, sans-serif; line-height:1;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
    min-width:19px; height:19px; border-radius:999px; padding:0 6px; box-sizing:border-box;
    display:inline-flex; align-items:center; justify-content:center; text-align:center;
    flex-shrink:0; }

  /* 채팅방 화면 */
  #roomScreen { display:none; flex-direction:column; position:relative; }
  #roomScreen.active { display:flex; }
  .messages { flex:1; overflow-y:auto; padding:12px 12px 16px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }

  /* 스크롤바는 숨기고 터치·휠 스크롤은 그대로 (카톡처럼) */
  .messages, #chatList { scrollbar-width:none; -ms-overflow-style:none; }
  .messages::-webkit-scrollbar, #chatList::-webkit-scrollbar { width:0; height:0; display:none; }

  .float-date { position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:rgba(0,0,0,.42); color:#fff; font-size:12px; padding:5px 12px; border-radius:14px;
    white-space:nowrap; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20; }
  .float-date.show { opacity:1; }

  .date-divider { text-align:center; margin:14px 0; }
  .date-divider span { background:rgba(0,0,0,.12); color:#fff; font-size:12px;
    padding:4px 12px; border-radius:12px; }

  /* 초대 안내 같은 시스템 문구 (카카오톡 방식: 배경 없는 가운데 회색 글씨) */
  .sys-notice { text-align:center; margin:2px 22px 14px; font-size:11.5px; line-height:1.5;
    color:rgba(0,0,0,.42); word-break:keep-all; }

  .msg-row { display:flex; margin-bottom:10px; align-items:flex-start; }
  .msg-row.mine { flex-direction:row-reverse; }
  .msg-avatar { width:40px; height:40px; border-radius:14px; flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; }
  .msg-avatar img { width:100%; height:100%; object-fit:cover; }
  .msg-avatar.spacer { background:transparent !important; }
  .msg-body { max-width:68%; margin:0 8px; }
  .msg-sender { font-size:12.5px; color:#3a3a3a; margin-bottom:4px; margin-left:2px; }
  .msg-line { display:flex; align-items:flex-end; }
  .msg-row.mine .msg-line { flex-direction:row-reverse; }
  .bubble { padding:8px 11px; border-radius:14px; font-size:14.5px; line-height:1.4;
    word-break:break-word; white-space:pre-wrap; }
  .msg-row:not(.mine) .bubble { background:#fff; border-top-left-radius:3px; color:#1a1a1a; }
  .msg-row.mine .bubble { background:#fef01b; border-top-right-radius:3px; color:#1a1a1a; }
  .msg-info { display:flex; flex-direction:column; font-size:10.5px; margin:0 5px;
    color:#5a6b7a; align-items:flex-start; }
  .msg-row.mine .msg-info { align-items:flex-end; }
  .msg-unread { color:#fee500; font-weight:700; }
  .msg-row:not(.mine) .msg-unread { color:#4a7ab5; }

  /* 사진 메시지 (카카오톡 UI: 말풍선 없이 둥근 사진) */

  .msg-file { background:#fff; border-radius:14px; padding:12px 14px; box-sizing:border-box;

    box-shadow:0 1px 3px rgba(0,0,0,.10); }
  .msg-file .mf-main { flex:1; min-width:0; }
  .msg-file .mf-name { font-size:14.5px; font-weight:700; color:#1a1a1a; line-height:1.35;
    word-break:break-all; }

  /* ---------- 글자·프로필 크기 (폰마다 따로) ----------
     --fs = 글자 배율, --fc = 프로필 사진 배율. 둘 다 1 이 지금 크기.
     손님에게 보이는 화면에만 걸고, 관리자 편집 화면은 건드리지 않는다. */
  #phone { --fs:1; --fc:1; }

  #listScreen .header .title { font-size:calc(24px * var(--fs)); }
  #roomScreen .header .title { font-size:calc(18px * var(--fs)); }
  #listScreen .header .actions button { font-size:calc(20px * var(--fs)); }
  #roomScreen .header .back { font-size:calc(24px * var(--fs)); }
  #listScreen .chip { font-size:calc(15.5px * var(--fs)); }
  #listScreen .adbox .ad-top  { font-size:calc(11.5px * var(--fs)); }
  #listScreen .adbox .ad-head { font-size:calc(16.5px * var(--fs)); }
  #listScreen .adbox .ad-foot { font-size:calc(11px * var(--fs)); }
  #listScreen .adbox .ad-tag  { font-size:calc(8.5px * var(--fs)); }
  #listScreen .chat-name    { font-size:calc(16.5px * var(--fs)); }
  #listScreen .chat-count   { font-size:calc(15px * var(--fs)); }
  #listScreen .chat-preview { font-size:calc(14.5px * var(--fs)); }
  #listScreen .chat-time    { font-size:calc(13px * var(--fs)); }
  #listScreen .badge        { font-size:calc(11px * var(--fs)); }
  #listScreen .tab-badge    { font-size:calc(10px * var(--fs)); }
  #listScreen .empty        { font-size:calc(14px * var(--fs)); }
  #roomScreen .msg-sender   { font-size:calc(12.5px * var(--fs)); }
  #roomScreen .bubble       { font-size:calc(14.5px * var(--fs)); }
  #roomScreen .msg-info     { font-size:calc(10.5px * var(--fs)); }
  #roomScreen .date-divider span { font-size:calc(12px * var(--fs)); }
  #roomScreen .sys-notice   { font-size:calc(11.5px * var(--fs)); }
  #roomScreen .float-date   { font-size:calc(12px * var(--fs)); }
  #roomScreen .msg-file .mf-name { font-size:calc(14.5px * var(--fs)); }
  #roomScreen .msg-file .mf-row  { font-size:calc(12.5px * var(--fs)); }
  #roomScreen .inputbar .plus       { font-size:calc(24px * var(--fs)); }
  #roomScreen .inputbar .fake-input { font-size:calc(14px * var(--fs)); }
  #roomScreen .inputbar .send       { font-size:calc(20px * var(--fs)); }

  /* 프로필 사진 (대화방 목록 · 말풍선 옆) */
  #listScreen .avatar { width:calc(48px * var(--fc)); height:calc(48px * var(--fc));
    border-radius:calc(19px * var(--fc)); font-size:calc(18px * var(--fc)); }
  #roomScreen .msg-avatar { width:calc(40px * var(--fc)); height:calc(40px * var(--fc));
    border-radius:calc(14px * var(--fc)); font-size:calc(15px * var(--fc)); }

  /* 관리자 — 사람마다 보이는 대화 범위 */
  .vis-person { border:1px solid #e3e7ec; border-radius:10px; padding:8px 10px; margin-bottom:8px; }

  /* 사진 크게 보기 */

  /* PC(마우스 쓰는 넓은 화면): 사이드바 · 대화방 편집 · 대화 내용 3단 */

<!-- ===================== 구형 브라우저 호환 블록 =====================
     삼성 인터넷 5.0(2016년 갤럭시) 이상, 크롬 49 이상에서도 앱이 열리도록
     없는 기능을 대신 채워 넣는다. 최신 기기에서는 아무 일도 하지 않는다. -->
<style id="oldBrowserCss">
/* 단체방 프로필 사진 묶음 — 크롬 57 미만에는 grid가 없어서 flex로 대신한다 */
@supports not (display:grid){
  .avatar.grp{ display:flex; flex-wrap:wrap; }
  .avatar.grp>*{ box-sizing:border-box; }
  .avatar.grp.n1>*{ width:100%; height:100%; }
  .avatar.grp.n2>*{ width:50%; height:100%; }
  .avatar.grp.n3>*,.avatar.grp.n4>*{ width:50%; height:50%; }
}
</style>
<script>
(function(){
  'use strict';

  /* ---------- 1. 없는 자바스크립트 기능 채우기 ---------- */

  /* 숫자 앞에 0을 붙일 때 쓴다 (시각 표시). 크롬 57 미만에 없음 */
  if(!String.prototype.padStart){
    String.prototype.padStart = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return fill.slice(0, len - s.length) + s;
    };
  }
  if(!String.prototype.padEnd){
    String.prototype.padEnd = function(len, pad){
      var s = String(this);
      pad = (pad === undefined) ? ' ' : String(pad);
      if(s.length >= len || pad === '') return s;
      var fill = '';
      while(fill.length < len - s.length) fill += pad;
      return s + fill.slice(0, len - s.length);
    };
  }

  /* 앱 설치 안내를 닫을 때 쓴다. 크롬 63 미만에 없음 */
  if(window.Promise && !Promise.prototype['finally']){
    Promise.prototype['finally'] = function(cb){
      var P = this.constructor || Promise;
      return this.then(
        function(v){ return P.resolve(cb()).then(function(){ return v; }); },
        function(e){ return P.resolve(cb()).then(function(){ throw e; }); }
      );
    };
  }

  /* 화면 요소를 한꺼번에 훑을 때 쓴다. 크롬 51 미만에 없어서 앱이 멈춘다 */
  ['NodeList','HTMLCollection','DOMTokenList'].forEach(function(n){
    var C = window[n];
    if(C && C.prototype && !C.prototype.forEach){
      C.prototype.forEach = Array.prototype.forEach;
    }
  });

  if(!Object.entries){
    Object.entries = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push([k, o[k]]); }
      return r;
    };
  }
  if(!Object.values){
    Object.values = function(o){
      var r = [], k;
      for(k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r.push(o[k]); }
      return r;
    };
  }
  if(!Array.prototype.includes){
    Array.prototype.includes = function(v){ return this.indexOf(v) !== -1; };
  }
  if(window.Element && !Element.prototype.closest){
    var m = Element.prototype.matches || Element.prototype.webkitMatchesSelector ||
            Element.prototype.msMatchesSelector;
    Element.prototype.matches = m;
    Element.prototype.closest = function(sel){
      var e = this;
      while(e && e.nodeType === 1){ if(m.call(e, sel)) return e; e = e.parentElement; }
      return null;
    };
  }

  /* ---------- 2. 칸 사이 여백(gap) 대신 여백 직접 계산 ---------- */
  /* 크롬 84 미만에서는 flex 안의 gap이 무시되어 글자·버튼이 다 붙어 보인다.
     그래서 스타일을 훑어 gap이 쓰인 곳을 찾아 바깥여백으로 바꿔 준다. */

  var gapStyle = null;

  function flexGapWorks(){
    var box = document.createElement('div');
    box.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;' +
                        'position:absolute;visibility:hidden;height:0;overflow:visible';
    box.appendChild(document.createElement('div'));
    box.appendChild(document.createElement('div'));
    var host = document.body || document.documentElement;
    host.appendChild(box);
    var ok = box.scrollHeight === 1;
    host.removeChild(box);
    return ok;
  }

  function firstValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    return v.split(/\s+/)[0];
  }
  function secondValue(v){
    v = (v || '').trim();
    if(!v || v === 'normal') return '';
    var p = v.split(/\s+/);
    return p[1] || p[0];
  }

  function collect(rules, out){
    if(!rules) return;
    for(var i = 0; i < rules.length; i++){
      var r = rules[i];
      if(r.cssRules && r.cssRules.length) collect(r.cssRules, out);   /* @media 안쪽까지 */
      if(!r.style || !r.selectorText) continue;
      if(r.style.gridTemplateColumns || r.style.gridTemplateRows) continue;  /* 표 배치는 따로 처리 */
      if((r.style.display || '').indexOf('grid') >= 0) continue;

      var g  = r.style.getPropertyValue('gap');
      var rg = (r.style.getPropertyValue('row-gap')    || firstValue(g)).trim();
      var cg = (r.style.getPropertyValue('column-gap') || secondValue(g)).trim();
      if(rg === 'normal') rg = '';
      if(cg === 'normal') cg = '';
      if(!rg && !cg) continue;

      out.push({ sel: r.selectorText, rg: rg, cg: cg,
                 disp: (r.style.display || '').trim(),
                 dir:  (r.style.flexDirection || '').trim(),
                 wrap: (r.style.flexWrap || '').trim() });
    }
  }

  function buildGapCss(){
    var found = [];
    var sheets = document.styleSheets;
    for(var i = 0; i < sheets.length; i++){
      try { collect(sheets[i].cssRules, found); } catch(e){ /* 읽을 수 없는 스타일은 건너뛴다 */ }
    }

    var css = [];
    for(var k = 0; k < found.length; k++){
      var f = found[k];
      var parts = f.sel.split(',');
      for(var s = 0; s < parts.length; s++){
        var sel = parts[s].trim();
        if(!sel || sel.indexOf('::') >= 0) continue;

        /* 실제 화면에 있는 요소를 보고 가로줄인지 세로줄인지 판단한다 */
        var el = null, cs = null;
        try { el = document.querySelector(sel); } catch(e){ continue; }
        if(el && window.getComputedStyle) cs = window.getComputedStyle(el);

        var disp = f.disp || (cs ? cs.display : '');
        if(disp.indexOf('flex') < 0) continue;          /* flex가 아니면 손대지 않는다 */

        var dir  = f.dir  || (cs ? (cs.flexDirection || 'row') : 'row');
        var wrap = f.wrap || (cs ? (cs.flexWrap || 'nowrap') : 'nowrap');
        var column = dir.indexOf('column') === 0;

        if(wrap.indexOf('wrap') === 0){
          /* 줄바꿈되는 묶음은 모든 칸에 여백을 준다 */
          if(f.cg) css.push(sel + '>*{margin-right:' + f.cg + '}');
          if(f.rg) css.push(sel + '>*{margin-bottom:' + f.rg + '}');
        } else if(column){
          if(f.rg) css.push(sel + '>*+*{margin-top:' + f.rg + '}');
        } else {
          if(f.cg) css.push(sel + '>*+*{margin-left:' + f.cg + '}');
        }
      }
    }

    if(!gapStyle){
      gapStyle = document.createElement('style');
      gapStyle.id = 'oldBrowserGap';
      (document.head || document.documentElement).appendChild(gapStyle);
    }
    gapStyle.textContent = css.join('\n');
  }

  function startGapFix(){
    try {
      if(flexGapWorks()) return;            /* 요즘 기기 — 그대로 둔다 */
      buildGapCss();
      /* 앱이 화면을 다 그린 뒤 한 번 더 — 그때 생긴 부분까지 맞춘다 */
      setTimeout(buildGapCss, 1200);
      setTimeout(buildGapCss, 3000);
    } catch(e){ /* 실패해도 앱은 그대로 쓸 수 있으니 조용히 넘어간다 */ }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', startGapFix);
  } else {
    startGapFix();
  }
})();
</script>

<body>
<div id="phone" style="--safe-b: 0px; --fs: 1.000; --fc: 1.000;">
  <div class="mode-pill" id="modePill">관리자 모드</div>

  <!-- 채팅 목록 화면 -->
  <div class="screen" id="listScreen">
    <div class="header">
      <div class="title" id="listTitle">채팅</div>
      <div class="actions">
        <button title="검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"></circle><path d="M21 21l-5.2-5.2"></path></svg>
        </button>
        <button id="btnFull" title="새 채팅 (전체화면)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5V11c0-3.9-3.6-7-8-7s-8 3.1-8 7c0 2.4 1.3 4.5 3.4 5.7-.2 1-.6 2.1-.9 2.8 1.4-.5 3-1.3 3.8-1.9.6.1 1.1.2 1.7.2"></path><path d="M18 16v5M15.5 18.5h5"></path></svg>
        </button>
        <button id="btnAdmin" title="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"></path></svg>
        </button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="adbox" id="adbox"></div>
    <div id="chatList"></div>
    <div class="tabbar">
      <div class="tab" title="친구">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="4.2"></circle><path d="M12 13.2c-4.6 0-8.3 2.7-8.3 6.3 0 .6.4 1 1 1h14.6c.6 0 1-.4 1-1 0-3.6-3.7-6.3-8.3-6.3z"></path></svg>
      </div>
      <div class="tab active" title="채팅">
        <div class="tab-ico">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.7 1.7 5.1 4.3 6.5-.2.9-.7 2.4-1 3.1-.1.4.3.7.6.5 1.4-.6 3.2-1.5 4.1-2.1.6.1 1.3.1 2 .1 5.5 0 10-3.6 10-8s-4.5-8-10-8z"></path></svg>
          <span class="tab-badge hidden" id="chatTabBadge">1</span>
        </div>
      </div>
      <div class="tab" title="오픈채팅">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3C5.6 3 2 5.9 2 9.6c0 2.2 1.3 4.1 3.3 5.3-.2.8-.5 1.9-.8 2.5-.1.3.2.6.5.4 1.1-.5 2.6-1.2 3.3-1.7.5.1 1.1.1 1.7.1 4.4 0 8-2.9 8-6.6S14.4 3 10 3z"></path><path d="M19.5 10.2c.3.7.5 1.5.5 2.3 0 3.8-3.4 6.8-8 7.3 1.3 1.1 3.2 1.7 5.3 1.7.5 0 1 0 1.4-.1.6.4 1.8 1 2.7 1.4.3.1.5-.1.4-.4-.2-.5-.5-1.4-.7-2 1.7-1 2.9-2.6 2.9-4.4 0-2.4-1.9-4.5-4.5-5.8z" opacity=".85"></path></svg>
      </div>
      <div class="tab" title="쇼핑">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 8V7a4.5 4.5 0 019 0v1H19c.6 0 1 .4 1 1l-1 10.4c-.1 1-.9 1.6-1.9 1.6H6.9c-1 0-1.8-.7-1.9-1.6L4 9c0-.6.4-1 1-1h2.5zm2 0h5V7a2.5 2.5 0 00-5 0v1z"></path></svg>
      </div>
      <div class="tab" title="더보기">
        <div class="tab-ico">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.1"></circle><circle cx="12" cy="12" r="2.1"></circle><circle cx="19" cy="12" r="2.1"></circle></svg>
          <span class="rdot"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 채팅방 화면 -->
  <div class="screen" id="roomScreen">
    <div class="header">
      <button class="back" id="btnBack">‹</button>
      <div class="title" id="roomTitle"> 3</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="float-date" id="floatDate"><span>2020년 2월 18일 화요일</span></div>
    <div class="inputbar">
      <span class="plus">＋</span>
      <div class="fake-input">메시지 입력</div>
      <span class="send">➤</span>
    </div>
  </div>

  <!-- 이 폰을 쓸 지점 고르기 -->
  <div id="pickBranch">

   DATA_VERSION 을 고치지 않고 내용만 바꿔도 “새 파일”로 인식하게 해준다. */
function fingerprint(o){
  let s;
  try{ s = JSON.stringify(o); }catch(e){ return 'x'; }
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){
    h = (h ^ s.charCodeAt(i)) >>> 0;
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(36) + '-' + s.length.toString(36);
}

/* ---------- 저장소 ----------
   사진이 많아지면 localStorage(약 5MB)로는 모자라므로 IndexedDB 를 주 저장소로 쓴다.
   IndexedDB 는 기기 여유 공간에 맞춰 보통 수백 MB 까지 쓸 수 있다.
   localStorage 는 예전 방식으로 저장해 둔 내용을 읽어오는 용도로만 남겨 둔다. */
const IDB_NAME = 'crimescene_kakao';
const IDB_STORE = 'box';
const IDB_KEY = 'main';
let idbState = 'ok';        /* ok | unavailable | error */
let idbBox = null;          /* 마지막으로 읽거나 저장한 내용 */
let saveBlocked = false;    /* 저장된 내용을 읽지 못했으면 덮어쓰지 않는다 */
let saveWarned = false;
let storeKind = 'localStorage';

function idbOpen(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ idbState = 'unavailable'; return rej(new Error('없음')); }
    /* 파일을 직접 열면(file://) IndexedDB 를 쓸 수 없다.
       브라우저에 따라 오류도 나지 않고 응답이 아예 오지 않아 화면이 멈추므로 먼저 걸러낸다. */
    if(location.protocol === 'file:'){ idbState = 'unavailable'; return rej(new Error('파일 직접 열기')); }
    let settled = false;
    const finish = (fn, v)=>{ if(!settled){ settled = true; clearTimeout(timer); fn(v); } };
    /* 그래도 응답이 없는 경우를 대비한 시간 제한 (앱이 멈추지 않게) */
    const timer = setTimeout(()=>{
      if(!settled){ settled = true; idbState = 'unavailable'; rej(new Error('시간 초과')); }
    }, 2500);
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, 1); }
    catch(e){ idbState = 'unavailable'; return finish(rej, e); }
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
    rq.onsuccess = ()=>{ idbState = 'ok'; finish(res, rq.result); };
    rq.onerror   = ()=>{ if(idbState !== 'unavailable') idbState = 'error'; finish(rej, rq.error || new Error('열기 실패')); };
    rq.onblocked = ()=>{ idbState = 'unavailable'; finish(rej, new Error('차단됨')); };
  });
}
/* “내용이 없음”과 “읽지 못함”은 완전히 다르다. 섞으면 읽기 실패 한 번에 사진이 날아간다. */
function idbRead(){
  return idbOpen().then(db=> new Promise(res=>{
    let tx;
    try{ tx = db.transaction(IDB_STORE, 'readonly'); }
    catch(e){ return res({ok:false, value:null}); }
    const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = ()=> res({ok:true, value:rq.result || null});
    rq.onerror   = ()=> res({ok:false, value:null});
  })).catch(()=> ({ok:false, value:null}));
}
function idbWrite(v){
  return idbOpen().then(db=> new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error || new Error('저장 실패'));
    tx.onabort    = ()=> rej(tx.error || new Error('저장 중단'));
  }));
}
function idbClear(){
  return idbOpen().then(db=> new Promise(res=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> res(false);
    tx.onabort    = ()=> res(false);
  })).catch(()=> false);
}
/* 안드로이드가 저장분을 임의로 지우지 않도록 “영구 저장”을 요청해 둔다 */
let persistState = '확인 중';
function askPersist(){
  try{
    if(!navigator.storage || !navigator.storage.persist){ persistState = '지원 안 함'; return Promise.resolve(); }
    return (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false))
      .then(p=> p ? true : navigator.storage.persist())
      .then(p=>{ persistState = p ? '켜짐' : '꺼짐'; })
      .catch(()=>{ persistState = '알 수 없음'; });
  }catch(e){ persistState = '알 수 없음'; return Promise.resolve(); }
}
/* 기기가 이 앱에 허용한 저장 공간 */
let quotaText = '확인 중';
function refreshQuota(){
  try{
    if(!navigator.storage || !navigator.storage.estimate){ quotaText = '알 수 없음'; return Promise.resolve(); }
    return navigator.storage.estimate().then(e=>{
      const mb = n => (n/1048576).toFixed(n < 104857600 ? 1 : 0) + ' MB';
      quotaText = mb(e.usage||0) + ' 사용 / ' + mb(e.quota||0) + ' 사용 가능';
    }).catch(()=>{ quotaText = '알 수 없음'; });
  }catch(e){ quotaText = '알 수 없음'; return Promise.resolve(); }
}

/* 파일에서 막 읽어온 상태의 지문. 이후 내용이 달라지면 “이 기기에만 저장된 수정”이다 */
let baseFp = null;

function load(){
  return idbRead().then(got=>{
    let box = got.value;
    if(!got.ok && idbState === 'error') saveBlocked = true;   /* 읽지 못했으면 덮어쓰지 않는다 */
    storeKind = (idbState === 'ok') ? 'IndexedDB' : 'localStorage';
    if(!box){
      /* 예전 방식(localStorage)으로 저장해 둔 내용이 있으면 옮겨 온다 */
      try{ box = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ box = null; }
    }
    if(box && box.data && box.version === DATA_VERSION && box.fp === DATA_FP){
      idbBox = box;
      baseFp = box.base || null;
      return normalize(box.data);
    }
    if(!saveBlocked) wipeStored();
    const fresh = normalize(deepCopy(EMBEDDED_DATA));
    baseFp = fingerprint(fresh);
    return fresh;
  });
}
function hasLocalEdits(){
  return !!baseFp && fingerprint(data) !== baseFp;
}

  /* 주 저장소 — IndexedDB */
  idbWrite(box).then(()=>{ saveWarned = false; }).catch(()=>{
    if(!saveWarned){ saveWarned = true; toast('저장하지 못했습니다. 내보내기로 백업해 주세요.'); }
  });
  /* 보조 — 용량이 허락하면 localStorage 에도 남긴다 (실패해도 그냥 넘어간다) */
  if(storageOK){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(box)); }catch(e){} }
  return true;
}

/* ---------- 새 파일 자동 감지 (재설치·파일 교체 반영) ----------
   설치된 앱은 캐시로도 열리기 때문에, 실행할 때마다 서버에 놓인 index.html 을
   한 번 확인해서 내용이 다르면 캐시·저장분을 지우고 새 파일로 다시 연다. */
const MARK_S = '/*__CS' + '_DATA_START__';
const MARK_E = '/*__CS' + '_DATA_END__*/';

function readFileData(txt){
  const i = txt.indexOf(MARK_S), j = txt.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  try{
    const block = txt.slice(i, j).replace(MARK_S, '/*');
    return (new Function(block + '\nreturn { v: DATA_VERSION, d: EMBEDDED_DATA };'))();
  }catch(e){ return null; }
}

function forceUpdate(){

  try{ steps.push(idbClear()); }catch(e){}
  try{ localStorage.removeItem(STORE_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{
    if(window.caches && caches.keys){
      steps.push(caches.keys().then(ks=>Promise.all(ks.filter(isMyCache).map(k=>caches.delete(k)))));
    }
  }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      steps.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(isMySW).map(r=>r.unregister()))));
    }
  }catch(e){}
  Promise.all(steps).then(go, go);
}

function checkForUpdate(manual){

      }
      if(same){ if(manual) toast('이미 최신 파일입니다'); return; }
      const tag = got.v + '|' + fingerprint(got.d);
      let tried = null;
      try{ tried = sessionStorage.getItem('cs_upd'); }catch(e){}

        toast('새 파일이 있는데 적용되지 않았습니다. 관리자 모드에서 “새 파일 확인”을 눌러주세요.');

      setTimeout(forceUpdate, 700);

    .catch(()=>{ if(manual) toast('서버에 연결할 수 없습니다. 서버 앱이 켜져 있는지 확인하세요.'); });
}

/* 옛 형식(rooms 가 최상위)도 그대로 받아들여 새 형식으로 올려준다 */
function normalize(d){
  if(!d) d = {};
  if(!Array.isArray(d.lists)){
    const one = {
      key: '기본',
      title: d.listTitle || '채팅',
      chipText: d.chipText || 'ChatGPT',
      bottomPad: Number(d.bottomPad)||0,
      ad: d.ad || {},
      rooms: Array.isArray(d.rooms) ? d.rooms : []
    };
    d = { appName: d.appName || '채팅', lists: [one] };
  }
  if(!d.appName) d.appName = '채팅';
  /* themeDefault(파일에 담는 화면 테마 기본값)는 일부러 여기서 채우지 않는다.
     없는 값을 억지로 넣으면 파일 지문이 달라져 “이 기기에만 저장된 수정이 있습니다”가
     괜히 뜬다. 값이 없으면 fileTheme() 이 ‘밝게’로 읽는다. */
  /* 저장된 내용에 빈(null) 항목이 섞여 있어도 앱이 멈추지 않게 먼저 걸러낸다 */
  d.lists = d.lists.filter(L=> L && typeof L === 'object');
  if(Array.isArray(d.tree)){
    d.tree = d.tree.filter(c1=> c1 && typeof c1 === 'object');
    d.tree.forEach(c1=>{
      if(Array.isArray(c1.children)) c1.children = c1.children.filter(c2=> c2 && typeof c2 === 'object');
    });
  }
  if(!d.lists.length) d.lists = [{ key:'기본', title:'채팅', chipText:'ChatGPT', bottomPad:0, ad:{}, rooms:[] }];

  const usedKeys = [];
  d.lists.forEach((L, i)=>{
    L.title = L.title || '채팅';
    if(L.label === undefined) L.label = '';     /* 소분류 표시 이름 (비면 주소용 이름 사용) */
    L.chipText = L.chipText || 'ChatGPT';
    L.bottomPad = Math.max(0, Number(L.bottomPad)||0);
    L.ad = Object.assign({ show:true, top:'', head:'', foot:'광고입니다.', img:'', logo:'' }, L.ad||{});
    if(!Array.isArray(L.rooms)) L.rooms = [];
    L.rooms = L.rooms.filter(r=> r && typeof r === 'object');
    if(Array.isArray(L.people)) L.people = L.people.filter(p=> p && typeof p === 'object');
    let k = String(L.key || L.title || ('목록'+(i+1))).trim() || ('목록'+(i+1));
    while(usedKeys.indexOf(normKey(k)) !== -1) k = k + '_2';
    usedKeys.push(normKey(k));
    L.key = k;

    L.rooms.forEach(room=>{
      if(!room.id) room.id = id();
      if(!Array.isArray(room.participants)) room.participants = [];
      if(!Array.isArray(room.messages)) room.messages = [];
      room.participants = room.participants.filter(p=> p && typeof p === 'object');
      room.messages = room.messages.filter(m=> m && typeof m === 'object');
      let c = 0;
      room.participants.forEach(p=>{
        if(!p.id) p.id = id();
        if(p.silo === undefined || p.silo === null) p.silo = c % 2;   /* 인물 명단으로 옮겨진다 */
        c++;
      });
      if(room.per && typeof room.per !== 'object') room.per = {};
      /* 사람마다 보이는 범위 — 쓸모없어진 항목은 치운다 */
      if(room.vis !== undefined){
        if(!room.vis || typeof room.vis !== 'object') delete room.vis;
        else {
          const ids = (room.messages||[]).map(m=> m && m.id);
          Object.keys(room.vis).forEach(pid=>{
            const v = room.vis[pid];
            if(!v || (v.mode !== 'none' && v.mode !== 'some')){ delete room.vis[pid]; return; }
            if(v.mode === 'some'){
              v.msgs = (Array.isArray(v.msgs) ? v.msgs : []).filter(x=> ids.indexOf(x) >= 0);
            } else { delete v.msgs; }
          });
          if(!Object.keys(room.vis).length) delete room.vis;
        }
      }
      room.messages.forEach(m=>{
        if(!m.id) m.id = id();
        if(m.text === undefined) m.text = '';
        if(m.image === undefined) m.image = '';
        if(m.time === undefined) m.time = '';
        if(m.date === undefined) m.date = '';
        /* 첨부파일 칸만 열어 두고 아무것도 안 적은 것은 들고 다니지 않는다 */
        if(m.file !== undefined){
          const ok = m.file && typeof m.file === 'object' &&
            ['name','date','expire','size'].some(k=> String(m.file[k]||'').trim());
          if(!ok) delete m.file;
        }
        m.unread = Number(m.unread)||0;
      });
    });
  });
  const keep = data;
  data = d;                 /* ensureTree 안에서 쓰는 도우미들이 data 를 참조한다 */
  try{ ensureTree(d); } catch(e){}
  try{ unifyCategories(d); } catch(e){}     /* 중분류 하나 = 카카오톡 한 벌 */
  try{ (d.lists||[]).forEach(ensurePeople); } catch(e){}   /* 사진을 인물 명단으로 모아 중복 제거 */
  try{ ensureAdDefault(d); } catch(e){}
  data = keep;
  return d;
}

function id(){ return 'x'+Math.random().toString(36).slice(2,9); }

/* ---------- 대화 목록(세트) ---------- */
function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'_'); }
function curList(){ return data.lists[listIdx] || data.lists[0]; }

/* ============================================================
   인물 · 이 기기에서 볼 “나”
   중분류 하나 = 대화 목록 하나 = 카카오톡 한 벌.
   대화 내용은 중분류에 한 번만 쓰고, 폰마다 “나”만 고르면 그 사람의 카카오톡이 된다.
   손님 화면에는 “나”가 참여한 대화방만 보인다.
   ============================================================ */
/* ---------- 이 폰의 지점 잠금 ----------
   폰 한 대는 한 지점만 본다. 처음 실행할 때 고르고, 그 뒤에는 바꿀 수 없다.
   다른 지점 내용은 화면에 아예 나오지 않아 스포일러를 막는다.
   (바꿔야 하면 주소 끝에 ?reset=1 을 붙여 이 기기 설정을 초기화한다) */
const BRANCH_KEY = 'crimescene_kakao_branch';
let branchLock = null;              /* {id, name} — 기기마다 따로 저장된다 */
function loadBranch(){
  try{ const v = JSON.parse(keepRead(BRANCH_KEY)); branchLock = (v && typeof v === 'object') ? v : null; }
  catch(e){ branchLock = null; }
}
function saveBranch(){
  keepWrite(BRANCH_KEY, branchLock ? JSON.stringify(branchLock) : '');
}
/* 잠긴 지점. 이름이 바뀌어도 id 로 따라가고, id 가 바뀌면 이름으로 찾아 고쳐 둔다 */
function lockedC1(){
  if(!branchLock || !data) return null;
  const byId = (data.tree||[]).find(c=>c.id === branchLock.id);
  if(byId){
    if(branchLock.name !== byId.name){ branchLock.name = byId.name; saveBranch(); }
    return byId;
  }
  const byName = (data.tree||[]).find(c=>c.name === branchLock.name);
  if(byName){ branchLock = {id:byName.id, name:byName.name}; saveBranch(); return byName; }
  return null;
}
/* PC(편집용)에서는 잠그지 않는다 — 제작자는 전체를 봐야 한다 */
function branchLocked(){ return !wideAdmin() && !!lockedC1(); }
function setBranch(c1){ branchLock = {id:c1.id, name:c1.name}; saveBranch(); }
/* 잠긴 지점 밖의 목록인지 */
function listAllowed(L){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk || !L) return true;
  const c = catOfList(L.key);
  return !!(c && c.c1.id === lk.id);
}
/* 잠긴 지점 밖을 보고 있으면 그 지점의 첫 목록으로 옮긴다 */
function fixListForBranch(){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk || listAllowed(curList())) return;
  const keys = [];
  (lk.children||[]).forEach(c2=> (c2.lists||[]).forEach(k=> keys.push(k)));
  for(const k of keys){ const i = findListIdx(k); if(i >= 0){ listIdx = i; return; } }
}
/* 지금 목록에 이 폰의 “나”가 없을 때, 볼 수 있는 다른 목록 중에 “나”가 정해진 곳을 찾아 옮긴다.
   테마가 둘 이상인 지점에서 앱을 껐다 켜면 첫 테마로 돌아가 손님 모드가 풀리던 것을 막는다 */
function fixListForMe(){
  if(meId()) return;
  const back = listIdx;
  for(let i = 0; i < data.lists.length; i++){
    const L = data.lists[i];
    if(!L || !viewAs[L.key] || !listAllowed(L)) continue;
    listIdx = i;
    if(meId()){ applyAliasMe(L.key); rememberList(); return; }
  }
  listIdx = back;                      /* 못 찾았으면 원래 보던 목록으로 되돌린다 */
}
/* 관리자 화면이 잠긴 지점 밖으로 나가지 않게 한다 */
function enforceBranchLock(){
  const lk = branchLocked() ? lockedC1() : null;
  if(!lk) return;
  if(treePath[0] !== lk.id){ treePath = [lk.id]; adminListPicked = false; adminRoomId = ''; }
}
function treeMinDepth(){ return branchLocked() ? 1 : 0; }

const VIEW_KEY = 'crimescene_kakao_me';
let viewAs = {};                    /* {목록키: 인물id} — 기기마다 따로 저장된다 */
function loadView(){
  try{ const v = JSON.parse(keepRead(VIEW_KEY)); viewAs = (v && typeof v === 'object') ? v : {}; }
  catch(e){ viewAs = {}; }
}
function saveView(){ keepWrite(VIEW_KEY, JSON.stringify(viewAs)); }

/* ---------- 두 군데에 적어 두기 ----------
   오래된 폰은 저장해 둔 내용(localStorage)을 저장 공간이 모자랄 때 통째로 지우기도 한다.
   그래서 고른 지점과 “나”는 쿠키에도 같이 적어 두고, 한쪽이 지워져도 다른 쪽에서 되살린다. */
function cookieSet(name, val){
  try{ document.cookie = name + '=' + encodeURIComponent(val) + ';path=/;max-age=34560000'; }catch(e){}
}
function cookieGet(name){
  try{
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){ return ''; }
}
/* 저장해 둔 값을 읽는다. localStorage 가 비어 있으면 쿠키에서 꺼내 되살린다 */
function keepRead(key){
  let v = '';
  try{ v = localStorage.getItem(key) || ''; }catch(e){}
  if(v) return v;
  v = cookieGet(key);
  if(v){ try{ localStorage.setItem(key, v); }catch(e){} }   /* 되살린 값을 다시 적어 둔다 */
  return v;
}
function keepWrite(key, v){
  try{ if(v) localStorage.setItem(key, v); else localStorage.removeItem(key); }catch(e){}
  cookieSet(key, v || '');
}

/* 인물 id 는 이름에서 만들어 어느 기기에서 만들어도 같게 한다
   (파일을 새로 받아도 폰에 고른 “나”가 그대로 유지되도록) */
function personId(name){
  const s = normKey(name);
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return 'p' + h.toString(36);
}
/* 목록 안의 모든 참여자를 인물 명단으로 모은다 (이름 기준, id 는 한번 정해지면 유지) */
function ensurePeople(L){
  if(!L) return [];
  if(!Array.isArray(L.people)) L.people = [];
  /* 어쩌다 빈 항목이 섞여 들어가도 앱이 멈추지 않게 걸러낸다.
     배열을 새로 만들지 않고 그 자리에서 지운다 — 새로 넣은 인물이 사라지지 않게 하기 위함 */
  for(let i = L.people.length - 1; i >= 0; i--){
    if(!L.people[i] || typeof L.people[i] !== 'object') L.people.splice(i, 1);
  }
  /* id 가 겹친 채로 저장된 명단을 고친다.
     (예전에는 “새 인물”을 만들어 이름을 바꾼 뒤 또 만들면 id 가 같아졌다.
      id 가 같으면 삭제·이름변경이 앞사람에게 가 버린다.)
     겹치면 뒤에 있는 사람의 id 만 새로 준다 — 앞사람을 가리키던 기존 연결은 건드리지 않는다. */
  const byName = {}, usedId = {};
  L.people.forEach(p=>{
    if(!p.id) p.id = personId(p.name);
    if(usedId[p.id]){
      let pid = personId(p.name), n = 2;
      while(usedId[pid] || L.people.some(x=> x !== p && x.id === pid)) pid = personId(p.name) + '_' + (n++);
      p.id = pid;
    }
    usedId[p.id] = 1;
    if(p.avatar === undefined) p.avatar = '';
    if(p.silo === undefined) p.silo = 0;
    byName[normKey(p.name)] = p;
  });
  (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(pt=>{
    const k = normKey(pt.name);
    if(!k) return;
    let p = byName[k];
    if(!p){
      let pid = personId(pt.name), n = 2;
      while(L.people.some(x=>x.id === pid)){ pid = personId(pt.name) + '_' + (n++); }
      p = {id:pid, name:pt.name, avatar:pt.avatar||'', silo:pt.silo||0};
      byName[k] = p; L.people.push(p);
    }
    if(!p.avatar && pt.avatar) p.avatar = pt.avatar;
    /* 사진은 인물 명단에 한 장만 둔다.
       같은 사람이 여러 방에 있어도 사진이 복사되지 않아 저장 공간이 크게 줄어든다. */
    if(pt.avatar !== undefined) delete pt.avatar;
    if(pt.silo !== undefined) delete pt.silo;
  }));
  return L.people;
}
/* 참여자의 얼굴(사진·실루엣 색)은 인물 명단에서 가져온다 */
function faceOf(p){
  if(!p) return { avatar:'', silo:0 };
  const L = curList();
  const per = L ? personByName(L, p.name) : null;
  return per || { avatar: p.avatar || '', silo: p.silo || 0 };
}
function peopleOf(L){ return ensurePeople(L || curList()); }
/* 찾기만 할 때는 명단을 다시 훑지 않는다 (화면을 그릴 때 자주 불린다) */
function personById(L, pid){
  const ps = (L && L.people) || [];
  return pid ? (ps.find(p=>p && p.id===pid) || null) : null;
}
function personByName(L, name){
  const k = normKey(name);
  const ps = (L && L.people) || [];
  return k ? (ps.find(p=>p && normKey(p.name)===k) || null) : null;
}
/* 새로 만드는 인물에게 줄 id.
   이름이 같아도 이미 쓰고 있는 id 면 뒤에 번호를 붙여 겹치지 않게 한다.
   (이름을 바꿔도 id 는 그대로 두기 때문에 — 폰에서 고른 “나”를 지키려고 —
    “새 인물”을 만들어 이름을 바꾼 뒤 또 만들면 id 가 겹칠 수 있다) */
/* ---------- 단역(엑스트라) ----------
   100명짜리 단톡방처럼 인원수만 채우면 되는 경우에 쓴다.
   p.extra = true 인 인물은 등장인물 목록에서 접혀 보이고 “이 사람으로 보기”에 나오지 않는다.
   말을 하는 사람은 단역으로 만들지 말고 보통 인물로 만든다. */
const EXTRA_SURNAME = ['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','전','홍','유','고','문','양','손','배','백','허','남','심'];
const EXTRA_GIVEN = ['민준','서연','도윤','하윤','시우','지우','예준','수아','주원','지유','지호','하은','건우','윤서','우진','채원','선우','다은','연우','소율',
  '현우','예린','지훈','아린','유준','지안','은우','시은','준서','수빈','민재','가은','성민','나윤','태윤','서윤','진우','유나','동현','하린'];
/* 성 30개 × 이름 40개를 엇갈려 뽑는다. 한 바퀴(120명)를 넘기면 뒤에 숫자를 붙인다 */
const EXTRA_CYCLE = 120;
function extraName(i){
  const s = EXTRA_SURNAME[i % EXTRA_SURNAME.length];
  const g = EXTRA_GIVEN[(i * 7 + 3) % EXTRA_GIVEN.length];
  const n = Math.floor(i / EXTRA_CYCLE);
  return s + g + (n ? String(n + 1) : '');
}
function isExtra(p){ return !!(p && p.extra); }
/* 이 방에 단역을 n 명 채운다. 이미 들어 있는 이름은 건너뛴다.
   names 를 주면 그 이름들로, 없으면 자동으로 지은 이름으로 채운다. */
function fillExtras(L, room, n, names){
  const list = peopleOf(L);
  const made = [];
  let i = 0, ni = 0, guard = 0;
  while(made.length < n && guard < n * 20 + 1000){
    guard++;
    let nm;
    if(names){ if(ni >= names.length) break; nm = names[ni++]; }
    else nm = extraName(i++);
    if(!nm) continue;
    if(inRoom(room, nm)) continue;
    let p = personByName(L, nm);
    if(!p){
      p = { id:newPersonId(L, nm), name:nm, avatar:'', silo:list.length % 2, extra:true };
      list.push(p);
    }
    room.participants.push({ id:id(), name:p.name });
    made.push(p.name);
  }
  return made;
}
function newPersonId(L, name){
  const ps = (L && L.people) || [];
  let pid = personId(name), n = 2;
  while(ps.some(x=> x && x.id === pid)) pid = personId(name) + '_' + (n++);
  return pid;
}
/* 이 기기에서 고른 “나”. id 로 먼저 찾고, 못 찾으면 이름으로 찾아 고쳐 둔다
   (내용을 새 파일로 바꿔도 폰에서 고른 사람이 그대로 유지된다) */
function meId(){
  const L = curList(); if(!L) return '';
  const v = viewAs[L.key];
  if(!v) return '';
  const want = (typeof v === 'string') ? {id:v, name:''} : v;
  const ps = peopleOf(L);
  let p = want.id ? ps.find(x=>x.id === want.id) : null;
  if(!p && want.name) p = ps.find(x=>normKey(x.name) === normKey(want.name));
  if(!p){ delete viewAs[L.key]; saveView(); return ''; }
  if(typeof v === 'string' || v.id !== p.id || v.name !== p.name){
    viewAs[L.key] = {id:p.id, name:p.name}; saveView();
  }
  return p.id;
}
function mePerson(){ return personById(curList(), meId()); }
function setMe(pid){
  const L = curList(); if(!L) return;
  const p = pid ? personById(L, pid) : null;
  if(p) viewAs[L.key] = {id:p.id, name:p.name};
  else delete viewAs[L.key];
  saveView(); applyMeFlags();
}
/* 관리자 화면에서는 “나”를 아직 안 골랐어도 첫 인물 기준으로 보여준다 */
function effMeId(){
  const m = meId();
  if(m) return m;
  if(!isAdmin) return '';
  const ps = peopleOf(curList());
  return ps.length ? ps[0].id : '';
}
/* 참여자의 isMe 는 저장하지 않고, 고른 “나”에 맞춰 그때그때 계산한다 */
function applyMeFlags(){
  const L = curList(); if(!L) return;
  const me = personById(L, effMeId());
  const k = me ? normKey(me.name) : '';
  /* isMe 는 저장 대상이 아니므로 JSON 에 들어가지 않게 숨은 속성으로 붙인다 */
  (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(p=>{
    try{
      Object.defineProperty(p, 'isMe', {
        value: (!!k && normKey(p.name) === k), enumerable:false, configurable:true, writable:true
      });
    }catch(e){ p.isMe = !!k && normKey(p.name) === k; }
  }));
}
function inRoom(room, name){
  const k = normKey(name);
  return !!k && (room.participants||[]).some(p=>normKey(p.name) === k);
}
/* 기본은 참여자 모두의 폰에 보인다.
   room.only 에 사람을 지정하면 그 사람 폰에만 보인다 (한 사람에게만 보여줄 때 쓴다) */
function visibleTo(room, pid){
  if(visModeFor(room, pid) === 'none') return false;   /* 이 사람은 이 방을 아예 못 본다 */
  const only = room && room.only;
  if(!Array.isArray(only) || !only.length) return true;
  return only.indexOf(pid) >= 0;
}

/* ---------- 사람마다 보이는 대화 범위 ----------
   room.vis[인물id] = { mode:'all' | 'none' | 'some', msgs:[보여줄 메시지 id...] }
   - all  : 전부 보기 (기본값, 저장하지 않는다)
   - none : 이 방이 아예 안 보인다 (대화방 목록에도 안 나온다)
   - some : 고른 메시지만 보인다 (중간에 들어오거나 나간 연출에 쓴다)
   같은 방을 A 는 처음부터, B 는 어느 시점부터 보게 만들 수 있다. */
function visModeFor(room, pid){
  const v = room && room.vis && pid && room.vis[pid];
  const m = v && v.mode;
  return (m === 'none' || m === 'some') ? m : 'all';
}
function visPickedIds(room, pid){
  const v = room && room.vis && pid && room.vis[pid];
  return (v && Array.isArray(v.msgs)) ? v.msgs : [];
}
/* 이 사람 폰에 실제로 보이는 메시지만 추린다 */
function msgsFor(room, pid){
  const all = (room && room.messages) || [];
  const mode = visModeFor(room, pid);
  if(mode === 'all') return all;
  if(mode === 'none') return [];
  const keep = visPickedIds(room, pid);
  if(!keep.length) return [];
  return all.filter(m => m && keep.indexOf(m.id) >= 0);
}
/* 이 기기에서 고른 “나” 기준 */
function myMsgs(room){ return msgsFor(room, effMeId()); }
function setVisMode(room, pid, mode){
  if(!pid) return;
  if(!room.vis || typeof room.vis !== 'object') room.vis = {};
  if(mode === 'all'){
    delete room.vis[pid];
    if(!Object.keys(room.vis).length) delete room.vis;
    return;
  }
  const cur = room.vis[pid] || {};
  room.vis[pid] = { mode: mode, msgs: Array.isArray(cur.msgs) ? cur.msgs : [] };
}
/* 손님 화면에 보이는 대화방 = 고른 “나”가 참여한 방 */
function visibleRooms(L){
  const me = personById(L, effMeId());
  if(!me) return [];
  return (L.rooms||[]).filter(r=> inRoom(r, me.name) && visibleTo(r, me.id));
}
function roomsOfPerson(L, pid){
  const p = personById(L, pid);
  if(!p) return [];
  return (L.rooms||[]).filter(r=> inRoom(r, p.name) && visibleTo(r, p.id));
}
/* 관리자 목록에 쓰는 방 이름 (1:1 은 참여자 두 사람을 모두 보여준다) */
function roomLabel(room){
  if(!room) return '';
  if(room.isGroup) return room.name || '단톡방';
  const ns = (room.participants||[]).map(p=>p.name).filter(Boolean);
  return ns.length ? ns.join(' ↔ ') : (room.name || '대화방');
}

/* ---------- 폰마다 다르게 부르는 이름 (카카오톡 “이름 변경”과 같은 것) ----------
   L.alias = { 보는사람id: { 상대id: '부를 이름' } }
   내용(대화방·메시지)은 실제 이름 그대로 두고, 화면에 그릴 때만 바꿔 보여준다.
   그래서 기신봄 폰에서 “회장님”과 나눈 대화를 고쳐도 현회장 폰의 같은 대화가 함께 바뀐다. */
function aliasMap(L, viewerId){
  if(!L || !viewerId) return {};
  return (L.alias && L.alias[viewerId]) || {};
}
function setAlias(L, viewerId, targetId, name){
  if(!L || !viewerId || !targetId) return;
  if(!L.alias) L.alias = {};
  if(!L.alias[viewerId]) L.alias[viewerId] = {};
  const v = String(name||'').trim();
  if(v) L.alias[viewerId][targetId] = v;
  else delete L.alias[viewerId][targetId];
  if(!Object.keys(L.alias[viewerId]).length) delete L.alias[viewerId];
}
/* 손님 화면에 보일 이름 (관리자 편집 화면에서는 실제 이름을 그대로 쓴다) */
function dispName(name){
  const L = curList(); if(!L) return name;
  const vid = effMeId(); if(!vid) return name;
  const p = personByName(L, name); if(!p) return name;
  const a = aliasMap(L, vid)[p.id];
  return (a && a.trim()) ? a.trim() : name;
}

/* 사진은 인물 명단에만 있으므로 따로 퍼뜨릴 것이 없다.
   (예전 파일에서 참여자에 남아 있던 사진만 정리한다) */
function spreadPerson(L, p){
  const k = normKey(p.name);
  (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(x=>{
    if(normKey(x.name) === k){ delete x.avatar; delete x.silo; }
  }));
}
/* 인물 이름 바꾸기 — 모든 대화방의 참여자와 메시지 발신자까지 함께 바꾼다 */
function renamePerson(L, p, newName){
  const nn = String(newName||'').trim();
  if(!nn || nn === p.name) return false;
  const dup = peopleOf(L).find(x=> x !== p && normKey(x.name) === normKey(nn));
  const old = normKey(p.name);
  (L.rooms||[]).forEach(r=>{
    (r.participants||[]).forEach(x=>{ if(normKey(x.name) === old) x.name = nn; });
    (r.messages||[]).forEach(m=>{ if(normKey(m.senderName) === old) m.senderName = nn; });
    /* 같은 이름이 둘이 되면 한 방에 두 번 들어가지 않게 정리한다 */
    const seen = {};
    r.participants = (r.participants||[]).filter(x=>{
      const k = normKey(x.name);
      if(seen[k]) return false;
      seen[k] = 1; return true;
    });
  });
  p.name = nn;
  if(dup){
    /* 이미 있던 같은 이름의 인물과 하나로 합친다 */
    if(!p.avatar && dup.avatar) p.avatar = dup.avatar;
    (L.rooms||[]).forEach(r=>{
      if(r.per && r.per[dup.id]){ r.per[p.id] = Object.assign({}, r.per[dup.id], r.per[p.id]||{}); delete r.per[dup.id]; }
    });
    const v = viewAs[L.key];
    if(v && ((typeof v === 'string' ? v : v.id) === dup.id)) viewAs[L.key] = {id:p.id, name:p.name};
    if(L.alias){
      if(L.alias[dup.id]){ L.alias[p.id] = Object.assign({}, L.alias[dup.id], L.alias[p.id]||{}); delete L.alias[dup.id]; }
      Object.keys(L.alias).forEach(vw=>{
        if(L.alias[vw][dup.id] !== undefined && L.alias[vw][p.id] === undefined) L.alias[vw][p.id] = L.alias[vw][dup.id];
        delete L.alias[vw][dup.id];
      });
    }
    L.people = L.people.filter(x=> x !== dup);
    saveView();
  }
  spreadPerson(L, p);
  return true;
}

/* ---------- 방 설정은 사람마다 따로 (안읽음 · 고정 · 알림) ---------- */
function perOf(room, pid){
  if(!room || !pid) return {};
  return (room.per && room.per[pid]) ? room.per[pid] : {};
}
function perSet(room, pid, key, val){
  if(!room || !pid) return;
  if(!room.per) room.per = {};
  if(!room.per[pid]) room.per[pid] = {};
  room.per[pid][key] = val;
}
function roomPinned(room){ return !!perOf(room, effMeId()).pinned; }
function roomMuted(room){ return !!perOf(room, effMeId()).muted; }
/* “나”가 마지막으로 보낸 뒤 상대가 보낸 메시지 개수 (카카오톡과 같은 방식) */
function autoUnreadFor(room, pid){
  const p = personById(curList(), pid);
  if(!p) return 0;
  const k = normKey(p.name);
  const msgs = msgsFor(room, pid);      /* 이 사람에게 보이는 것만 센다 */
  const mine = m => normKey(m.senderName) === k;
  let lastMine = -1;
  for(let i = msgs.length-1; i >= 0; i--){ if(mine(msgs[i])){ lastMine = i; break; } }
  let n = 0;
  for(let i = lastMine+1; i < msgs.length; i++){ if(!mine(msgs[i])) n++; }
  return n;
}
function unreadOf(room, pid){
  const v = perOf(room, pid).unread;
  if(typeof v === 'number' && v >= 0) return v;
  return autoUnreadFor(room, pid);
}

/* ---------- 분류(폴더) 트리 — 관리자 정리용, 손님 화면에는 영향 없음 ----------
   data.tree = [ { id, name(대분류), children:[ { id, name(중분류), lists:[목록 주소이름…] } ] } ] */
function sanitizeKey(s){
  return String(s||'').trim().replace(/\s+/g,'_').replace(/[?&#%\/\\]/g,'');
}
function makeListKey(c1name, c2name, label, self){
  const base = [c1name, c2name, label].map(sanitizeKey).filter(Boolean).join('_') || '목록';
  let k = base, n = 2;
  while(data.lists.some(L=>L!==self && normKey(L.key)===normKey(k))){ k = base + '_' + n; n++; }
  return k;
}
function listByKey(key){
  const n = normKey(key);
  return data.lists.find(L=>normKey(L.key)===n) || null;
}
function listsOfCat(c2){
  return (c2.lists||[]).map(k=>listByKey(k)).filter(Boolean);
}
function catOfList(key){
  const n = normKey(key);
  for(const c1 of data.tree){
    for(const c2 of c1.children){
      if((c2.lists||[]).some(k=>normKey(k)===n)) return { c1:c1, c2:c2 };
    }
  }
  return null;
}
function treeRemoveList(key){
  const n = normKey(key);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).filter(k=>normKey(k)!==n);
  }));
}
function treeRenameListKey(oldKey, newKey){
  const n = normKey(oldKey);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = (c2.lists||[]).map(k=> normKey(k)===n ? newKey : k);
  }));
}
function countInCat1(c1){
  let rooms = 0;
  (c1.children||[]).forEach(c2=> listsOfCat(c2).forEach(L=> rooms += (L.rooms||[]).length));
  return { subs:(c1.children||[]).length, rooms:rooms };
}
/* 중분류 하나에 목록(카카오톡 한 벌) 하나 — 없으면 만들어 준다 */
function listOfCat(c1, c2){
  const have = listsOfCat(c2);
  if(have.length) return have[0];
  const L = { key: makeListKey(c1.name, c2.name, '', null), label:c2.name, title:'채팅',
              chipText:'ChatGPT', bottomPad:0, ad:adTemplate(), rooms:[], people:[], unified:true };
  data.lists.push(L);
  c2.lists = [L.key];
  return L;
}
/* ---------- 공통 광고 배너 ----------
   모든 목록이 같은 광고를 쓰고, 새로 만드는 목록에도 자동으로 들어간다.
   기준은 data.adDefault 이며 없으면 “박씨네”(없으면 첫 목록)의 광고에서 가져온다. */
function adTemplate(d){
  const src = d || data;
  return Object.assign({ show:true, top:'', head:'', foot:'광고입니다.', img:'', logo:'' }, src.adDefault || {});
}
function ensureAdDefault(d){
  if(d.adDefault) return;
  let ref = (d.lists||[]).find(L=>String(L.label||'').indexOf('박씨네') >= 0)
         || (d.lists||[]).find(L=>L.ad && L.ad.show && (L.ad.head||L.ad.top))
         || (d.lists||[])[0];
  d.adDefault = Object.assign({ show:true, top:'', head:'', foot:'광고입니다.', img:'', logo:'' }, (ref && ref.ad) || {});
  /* 처음 도입할 때 모든 목록에 같은 광고를 넣어준다 */
  (d.lists||[]).forEach(L=>{ L.ad = JSON.parse(JSON.stringify(d.adDefault)); });
}
/* 지금 목록의 광고를 모든 목록에 적용하고, 새 목록의 기본값으로도 저장 */
function applyAdToAll(){
  const src = curList().ad || {};
  data.adDefault = JSON.parse(JSON.stringify(src));
  data.lists.forEach(L=>{ L.ad = JSON.parse(JSON.stringify(src)); });
  save(); renderChrome(); renderAdminHome();
  toast('광고 배너를 모든 목록(' + data.lists.length + '개)에 적용했습니다');
}

/* 참여자 구성(이름 묶음)이 같은지 — 순서와 무관하게 비교.
   옛 구조를 중분류 한 벌로 합칠 때 “같은 대화방”을 알아보는 기준이다. */
function compositionKey(room){
  return (room.participants||[]).map(p=>normKey(p.name)).filter(Boolean).sort().join('|');
}

/* 트리 정리 + 옛 데이터 올려주기 */
function ensureTree(d){
  if(!Array.isArray(d.tree)) d.tree = [];
  d.tree = d.tree.filter(c1=>c1 && typeof c1 === 'object');
  d.tree.forEach(c1=>{
    if(!c1.id) c1.id = id();
    c1.name = String(c1.name || '분류');
    if(!Array.isArray(c1.children)) c1.children = [];
    c1.children.forEach(c2=>{
      if(!c2.id) c2.id = id();
      c2.name = String(c2.name || '분류');
      if(!Array.isArray(c2.lists)) c2.lists = [];
    });
  });
  /* 트리에 들어있지 않은 목록 찾기 */
  const inTree = {};
  d.tree.forEach(c1=>c1.children.forEach(c2=>c2.lists.forEach(k=>{ inTree[normKey(k)] = true; })));
  const orphans = d.lists.filter(L=>!inTree[normKey(L.key)]);
  if(!orphans.length){
    /* 없어진 목록을 가리키는 항목 정리 */
    d.tree.forEach(c1=>c1.children.forEach(c2=>{
      c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
    }));
    return;
  }
  let target;
  if(!d.tree.length){
    /* 처음 분류를 도입할 때: 기존 목록을 “강남1호점 > 폐가” 아래로 넣는다 */
    const c2 = { id:id(), name:'폐가', lists:[] };
    d.tree.push({ id:id(), name:'강남1호점', children:[c2] });
    target = { c1:d.tree[0], c2:c2 };
  } else {
    let c1 = d.tree.find(c=>c.name === '미분류');
    if(!c1){ c1 = { id:id(), name:'미분류', children:[] }; d.tree.push(c1); }
    let c2 = c1.children[0];
    if(!c2){ c2 = { id:id(), name:'미분류', lists:[] }; c1.children.push(c2); }
    target = { c1:c1, c2:c2 };
  }
  orphans.forEach(L=>{
    if(L.label === undefined || L.label === ''){
      const p = normKey(target.c2.name) + '_';
      L.label = (normKey(L.key).indexOf(p) === 0) ? L.key.slice(target.c2.name.length + 1) : L.key;
    }
    const newKey = makeListKey(target.c1.name, target.c2.name, L.label, L);
    if(normKey(newKey) !== normKey(L.key)) L.key = newKey;
    target.c2.lists.push(L.key);
  });
  d.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k)));
  }));
}

/* ============================================================
   예전 구조(소분류 = 사람마다 따로 만든 목록) → 중분류 한 벌로 합치기
   같은 중분류 안에서 참여자 구성이 같은 방은 한 방으로 합치고,
   목록마다 “나”였던 사람은 실제 이름을 가진 인물로 바꾼다.
   이미 합쳐진 목록(unified)은 건드리지 않는다.
   ============================================================ */
function unifyCategories(d){
  (d.tree||[]).forEach(c1=> (c1.children||[]).forEach(c2=>{
    const keys = (c2.lists||[]).filter(k=> d.lists.some(L=>normKey(L.key)===normKey(k)));
    const members = keys.map(k=> d.lists.find(L=>normKey(L.key)===normKey(k)));
    if(!members.length) return;
    const legacy = members.filter(L=> L.unified !== true);
    const target = members[0];
    if(!legacy.length && members.length === 1){ ensurePeople(target); return; }   /* 이미 합쳐진 상태 */

    /* 1) 목록마다 “나”였던 사람의 이름을 정한다 ------------------------------ */
    const nameCount = {};
    members.forEach(L=> (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(p=>{
      const k = normKey(p.name); if(k) nameCount[k] = (nameCount[k]||0) + 1;
    })));
    const ownerOf = {};                 /* 목록키 → 주인 이름 */
    legacy.forEach(L=>{
      const meNames = [];
      (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(p=>{
        if(p.isMe && p.name && normKey(p.name) !== '나' && meNames.indexOf(p.name) < 0) meNames.push(p.name);
      }));
      let owner;
      if(meNames.length){
        /* 여러 이름을 썼으면, 다른 사람들이 더 많이 부르는 이름으로 통일한다 */
        owner = meNames.slice().sort((a,b)=> (nameCount[normKey(b)]||0) - (nameCount[normKey(a)]||0))[0];
      } else {
        const label = (L.label && L.label.trim()) ? L.label.trim() : L.key;
        const clash = (L.rooms||[]).some(r=> (r.participants||[]).some(p=> !p.isMe && normKey(p.name) === normKey(label)));
        owner = clash ? (label + '(본인)') : label;   /* 목록 이름이 상대 이름과 겹치면 구분해 준다 */
      }
      ownerOf[L.key] = owner;
      (L.rooms||[]).forEach(r=>{
        const mp = (r.participants||[]).find(p=>p.isMe);
        if(!mp) return;
        const oldName = mp.name;
        mp.name = owner;
        (r.messages||[]).forEach(m=>{ if(normKey(m.senderName) === normKey(oldName)) m.senderName = owner; });
      });
    });

    /* 2) 참여자 구성이 같은 방을 한 방으로 합치며 모은다 ---------------------- */
    const pool = [], byComp = {}, flagJobs = [];
    members.forEach(L=>{
      const ownerName = ownerOf[L.key] || '';
      const seenHere = {};
      (L.rooms||[]).forEach(r=>{
        const base = compositionKey(r);
        const n = (seenHere[base] = (seenHere[base]||0) + 1);
        const ck = base + '#' + n;      /* 한 목록 안의 같은 구성끼리는 합치지 않는다 */
        let keep = byComp[ck];
        if(!keep){
          keep = r; byComp[ck] = r; pool.push(r);
        } else {
          if((r.messages||[]).length > (keep.messages||[]).length){
            keep.messages = r.messages;
            keep.name = r.name; keep.isGroup = r.isGroup;
            if(r.inviteText !== undefined) keep.inviteText = r.inviteText;
            if(r.inviteShow !== undefined) keep.inviteShow = r.inviteShow;
          }
          (r.participants||[]).forEach(p=>{
            const t = (keep.participants||[]).find(x=>normKey(x.name) === normKey(p.name));
            if(t && !t.avatar && p.avatar) t.avatar = p.avatar;
          });
          if(r.per) keep.per = Object.assign({}, r.per, keep.per||{});
        }
        if(L.unified !== true && ownerName){
          flagJobs.push({ room:keep, owner:ownerName,
            unread:(typeof r.listUnread === 'number' && r.listUnread >= 0) ? r.listUnread : null,
            pinned:!!r.pinned, muted:!!r.muted });
        }
      });
    });

    /* 3) 합친 목록 하나로 정리한다 ------------------------------------------ */
    const aliases = [];
    members.forEach(L=>{
      (L.aliases||[]).forEach(a=>{ if(aliases.indexOf(a) < 0) aliases.push(a); });
      if(aliases.indexOf(L.key) < 0) aliases.push(L.key);
    });
    target.rooms = pool;
    target.label = c2.name;
    target.unified = true;
    if(!target.today) target.today = (members.find(L=>L.today)||{}).today || '';
    members.slice(1).forEach(L=>{ const i = d.lists.indexOf(L); if(i >= 0) d.lists.splice(i, 1); });
    const newKey = makeListKey(c1.name, c2.name, '', target);
    target.key = newKey;
    target.aliases = aliases.filter(a=> normKey(a) !== normKey(newKey));
    c2.lists = [newKey];

    ensurePeople(target);
    /* 옛 주소(?list=…_왕소심)로 들어오면 그 사람으로 보이게 짝지어 둔다 */
    target.aliasMe = target.aliasMe || {};
    Object.keys(ownerOf).forEach(k=>{
      const p = personByName(target, ownerOf[k]);
      if(p) target.aliasMe[k] = p.id;
    });
    /* 4) 옛 방 설정(안읽음·고정·알림)을 그 목록 주인의 설정으로 옮긴다 -------- */
    flagJobs.forEach(j=>{
      const p = personByName(target, j.owner);
      if(!p) return;
      if(j.unread !== null) perSet(j.room, p.id, 'unread', j.unread);
      if(j.pinned) perSet(j.room, p.id, 'pinned', true);
      if(j.muted) perSet(j.room, p.id, 'muted', true);
    });
    pool.forEach(r=>{
      (r.participants||[]).forEach(p=>{ delete p.isMe; });
      delete r.pinned; delete r.muted; delete r.listUnread; delete r.sharedId; delete r.shared;
      if(!r.isGroup) r.name = '';
    });
  }));
}

function requestedListKey(){
  try{
    const u = new URL(location.href);
    let k = u.searchParams.get('list') || u.searchParams.get('l') || '';
    if(!k && location.hash) k = decodeURIComponent(location.hash.slice(1));
    return k || '';
  }catch(e){ return ''; }
}
function findListIdx(key){
  const n = normKey(key);
  if(!n) return -1;
  const i = data.lists.findIndex(L=>normKey(L.key)===n);
  if(i >= 0) return i;
  /* 합치기 전의 옛 주소(?list=…_왕소심)도 계속 통하게 한다 */
  return data.lists.findIndex(L=> (L.aliases||[]).some(a=>normKey(a)===n));
}
/* 옛 주소로 들어왔으면 그 주소의 주인을 이 기기의 “나”로 정해 준다 */
function applyAliasMe(key){
  const L = curList();
  if(!L || !key) return;
  if(viewAs[L.key]) return;                       /* 이미 고른 사람이 있으면 그대로 */
  const n = normKey(key);
  const map = L.aliasMe || {};
  const hit = Object.keys(map).find(k=>normKey(k) === n);
  if(hit && personById(L, map[hit])) setMe(map[hit]);
}
function requestedMeName(){

/* ---------- 날짜 / 시간 입력 변환 ---------- */
/* 20260504 → 2026-05-04, 2026.5.4 / 26-5-4 / 0504 도 인식 */
function parseDateInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  const nums = s.match(/\d+/g);
  if(!nums) return null;
  const digits = nums.join('');
  let y, mo, da;
  if(nums.length >= 3){ y = +nums[0]; mo = +nums[1]; da = +nums[2]; }
  else if(digits.length === 8){ y = +digits.slice(0,4); mo = +digits.slice(4,6); da = +digits.slice(6,8); }
  else if(digits.length === 6){ y = 2000 + (+digits.slice(0,2)); mo = +digits.slice(2,4); da = +digits.slice(4,6); }
  else if(nums.length === 2){ y = new Date().getFullYear(); mo = +nums[0]; da = +nums[1]; }
  else if(digits.length === 4){ y = new Date().getFullYear(); mo = +digits.slice(0,2); da = +digits.slice(2,4); }
  else return null;
  if(y < 100) y += 2000;
  if(!(mo>=1 && mo<=12) || !(da>=1 && da<=31)) return null;
  const d = new Date(y, mo-1, da);
  if(d.getFullYear()!==y || d.getMonth()!==mo-1 || d.getDate()!==da) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
}
/* 1450 → 오후 2:50, 930 → 오전 9:30, "오후 2:50" 은 그대로 */
function parseTimeInput(v){
  const s = String(v||'').trim();
  if(!s) return '';
  let ampm = '';
  if(/오전|AM|am|Am/.test(s)) ampm = '오전';
  if(/오후|PM|pm|Pm/.test(s)) ampm = '오후';
  const nums = s.replace(/[^\d]/g,'');
  if(!nums) return null;
  let h, mi;
  if(nums.length <= 2){ h = +nums; mi = 0; }
  else if(nums.length === 3){ h = +nums.slice(0,1); mi = +nums.slice(1); }
  else if(nums.length === 4){ h = +nums.slice(0,2); mi = +nums.slice(2); }
  else return null;
  if(mi > 59) return null;
  if(ampm){
    if(h < 1 || h > 12) return null;
  } else {
    if(h > 23) return null;
    ampm = h < 12 ? '오전' : '오후';
    h = (h % 12) || 12;
  }
  return `${ampm} ${h}:${String(mi).padStart(2,'0')}`;
}
function formatKoreanDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  const y=+parts[0], mo=+parts[1], da=+parts[2];
  const dObj = new Date(y, mo-1, da);
  if(isNaN(dObj)) return iso;
  const wd = ['일','월','화','수','목','금','토'][dObj.getDay()];
  return `${y}년 ${mo}월 ${da}일 ${wd}요일`;
}

/* 카카오톡과 같은 규칙:
   내가 마지막으로 보낸 시점 이후에 상대방이 보낸 메시지 개수.
   1:1·단톡방 모두 동일하며, 마지막 메시지를 내가 보냈으면 0이 된다.
   내가 한 번도 보낸 적이 없으면 상대방 메시지 전체 개수. */
function autoUnread(room){ return autoUnreadFor(room, effMeId()); }
/* ---------- 목록 정렬 / 시간 표시 ---------- */
/* "오후 9:12" → 하루 중 분 단위 값 */
function timeToMinutes(s){
  const str = String(s||'');
  const m = str.match(/(\d{1,2}):(\d{2})/);
  if(!m) return 0;
  let h = +m[1];
  const mi = +m[2];
  if(/오후|PM|pm/.test(str) && h < 12) h += 12;
  if(/오전|AM|am/.test(str) && h === 12) h = 0;
  return h*60 + mi;
}
/* 방의 마지막 메시지가 언제인지 (날짜는 바뀌는 날 첫 메시지에만 있으므로 누적해서 찾는다) */
function lastMsgWhen(room){
  const all = room.messages || [];
  const msgs = myMsgs(room);            /* 이 폰에 보이는 마지막 메시지 기준 */
  if(!msgs.length) return null;
  /* 날짜는 숨긴 메시지까지 훑어야 정확하다 (날짜는 바뀌는 날 첫 메시지에만 들어 있다) */
  const lastIdx = all.indexOf(msgs[msgs.length-1]);
  let date = '';
  for(let i = 0; i <= lastIdx; i++){ if(all[i].date) date = all[i].date; }
  const last = msgs[msgs.length-1];
  return { date: date, time: last.time || '', minutes: timeToMinutes(last.time) };
}
/* “오늘”로 볼 기준 날짜. 목록마다 지정할 수 있고, 비어 있으면 실제 오늘. */
function refToday(){
  const s = String((curList().today || '')).trim();
  if(s){
    const p = s.split('-');
    const y = +p[0], m = +p[1], d = +p[2];
    if(y && m && d){
      const dt = new Date(y, m-1, d);
      if(!isNaN(dt)) return { y:y, m:m, d:d, date:dt, fixed:true };
    }
  }
  const n = new Date();
  return { y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate(),
           date:new Date(n.getFullYear(), n.getMonth(), n.getDate()), fixed:false };
}
/* 정렬용 숫자 (날짜가 없으면 기준 날짜로 본다) */
function roomSortValue(room){
  const w = lastMsgWhen(room);
  if(!w) return -1;
  let y, m, d;
  if(w.date){ const p = w.date.split('-'); y = +p[0]; m = +p[1]; d = +p[2]; }
  if(!(y && m && d)){ const t = refToday(); y = t.y; m = t.m; d = t.d; }
  return (y*10000 + m*100 + d) * 2000 + w.minutes;
}
/* 목록 오른쪽 표시: 오늘이면 시간, 어제면 “어제”, 그보다 전이면 “9월 8일” */
function listTimeLabel(room){
  const w = lastMsgWhen(room);
  if(!w) return '';
  if(!w.date) return w.time;
  const p = w.date.split('-');
  const y = +p[0], m = +p[1], d = +p[2];
  if(!(y && m && d)) return w.time;
  const ref = refToday();
  const target = new Date(y, m-1, d);
  const diff = Math.round((ref.date - target) / 86400000);
  if(diff === 0) return w.time;
  if(diff === 1) return '어제';
  if(y !== ref.y) return `${y}. ${m}. ${d}.`;   /* 기준 날짜와 해가 다르면 연도까지 */
  return `${m}월 ${d}일`;
}
/* 고정된 방이 위, 그다음은 최신 메시지 순(자동 정렬을 끄면 저장된 순서) */
function orderedRooms(L){
  const auto = L.autoSort !== false;
  return visibleRooms(L).map((r,i)=>({r:r, i:i})).sort((a,b)=>{
    const pa = roomPinned(a.r)?1:0, pb = roomPinned(b.r)?1:0;
    if(pa !== pb) return pb - pa;
    if(auto){
      const sa = roomSortValue(a.r), sb = roomSortValue(b.r);
      if(sa !== sb) return sb - sa;
    }
    return a.i - b.i;
  }).map(x=>x.r);
}

  return '';
}

function renderList(){
  rememberList();        /* 지금 보고 있는 목록을 기억 (다음 실행 때 이 목록으로 시작) */
  syncAllRoomNames();
  applyMeFlags();        /* 이 기기에서 고른 “나” 를 참여자에 표시 */
  applyBottomPad();
  applyTheme();          /* 밝게 / 어둡게 */
  applySizes();          /* 글자·프로필 크기 */
  renderChrome();
  applyAppIdentity();
  const L = curList();
  $('#listTitle').textContent = L.title || '채팅';
  const el = $('#chatList'); el.innerHTML = '';
  if(!L.rooms.length){
    el.innerHTML = '<div class="empty">대화방이 없습니다.<br>관리자 모드에서 대화방을 추가하세요.<br><br>(제목을 5초 길게 누르면<br>관리자 모드로 들어갑니다)</div>';

  const mine = orderedRooms(L);
  if(!mine.length){
    const me = personById(L, effMeId());
    el.innerHTML = me
      ? `<div class="empty"><b>${esc(me.name)}</b> 님이 참여한 대화방이 없습니다.<br><br>(제목을 5초 길게 누르면<br>관리자 모드로 들어갑니다)</div>`
      : '<div class="empty">이 폰에서 볼 사람을 아직 고르지 않았습니다.<br>관리자 모드 → 등장인물에서<br><b>“이 사람으로 보기”</b>를 눌러 정하세요.<br><br>(제목을 5초 길게 누르면<br>관리자 모드로 들어갑니다)</div>';
    updateChatTabBadge(0);
    return;
  }
  let totalUnread = 0;
  mine.forEach(room=>{
    const mine2 = myMsgs(room);                 /* 이 폰에 보이는 것만 */
    const last = mine2[mine2.length-1];
    const preview = previewText(last);
    const time = listTimeLabel(room);
    const unread = roomUnread(room);
    totalUnread += unread;
    const other = room.participants.find(p=>!p.isMe) || room.participants[0] || {name:'?'};
    const av = room.isGroup ? groupAvatar(room) : oneAvatar(other);
    const div = document.createElement('div');
    div.className = 'chat-item';
    div.innerHTML = `
      ${av}
      <div class="chat-meta">
        <div class="chat-name-row">
          ${room.openChat ? OPEN_SVG : ''}
          <span class="chat-name">${esc(roomTitle(room))}</span>
          ${room.isGroup ? `<span class="chat-count">${room.participants.length}</span>`:''}
          ${roomPinned(room) ? PIN_SVG : ''}
          ${roomMuted(room) ? MUTE_SVG : ''}
        </div>
        <div class="chat-preview">${esc(preview)}</div>
      </div>
      <div class="chat-right">
        <span class="chat-time">${esc(time)}</span>
        ${unread>0 ? `<span class="badge">${unread>999?'999+':unread}</span>`:''}
      </div>`;
    div.onclick = ()=> openRoom(room.id);
    el.appendChild(div);

}

function oneAvatar(p){
  const f = faceOf(p);
  if(f.avatar) return `<div class="avatar"><img src="${f.avatar}"></div>`;

}
/* 단톡방 프로필: 나를 뺀 참여자 최대 4명의 사진으로 둥근 사각형을 분할 */
function groupAvatar(room){
  const others = room.participants.filter(p=>!p.isMe).slice(0,4);
  const cell = p => `<div class="cell">${
    p ? (function(f){ return f.avatar ? `<img src="${f.avatar}">` : silhouette(f.silo); })(faceOf(p)) : ''
  }</div>`;
  const n = Math.max(1, others.length);
  const cells = others.length ? others.map(cell).join('') : cell(null);
  return `<div class="avatar grp n${n}">${cells}</div>`;
}

/* ---------- 단톡방 초대 문구 ---------- */
/* 초대한 사람 = 참여자 목록 맨 위 사람, 초대된 사람 = 나머지 전원 */
function inviteAuto(room, useDisp){
  const ps = room.participants || [];
  if(ps.length < 2) return '';
  const nm = p => String((useDisp ? dispName(p.name) : p.name) || '').trim();
  const inviter = nm(ps[0]);
  const rest = ps.slice(1).map(nm).filter(Boolean);
  if(!inviter || !rest.length) return '';
  /* 단체방 인원이 많으면 이름을 다 늘어놓지 않는다 (실제 카카오톡도 앞 몇 명만 적는다) */
  if(rest.length > 6){
    const head = rest.slice(0, 5).map(n=>n+'님').join(', ');
    return `${inviter}님이 ${head} 외 ${rest.length - 5}명을 초대했습니다.`;
  }
  return `${inviter}님이 ${rest.map(n=>n+'님').join(', ')}을 초대했습니다.`;
}
function inviteShown(room){ return !!room.isGroup && room.inviteShow !== false; }
function inviteTextOf(room, useDisp){
  const own = (room.inviteText || '').trim();
  return own || inviteAuto(room, useDisp);
}
function inviteEl(room){
  const el = document.createElement('div');
  el.className = 'sys-notice';
  el.textContent = inviteTextOf(room, true);
  return el;
}

/* ---------- 파일 보낸 것처럼 보이는 카드 ----------
   메시지에 file = {name, date, expire, size} 가 들어 있으면 말풍선 대신 파일 카드로 보여준다.
   네 칸 모두 그냥 글자라서 원하는 대로 적으면 된다. 비워 둔 줄은 나오지 않는다.
   제목(name)이 비어 있으면 카드 자체가 안 나온다. */
const FILE_DL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 11l4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></svg>';
function fileCardHtml(msg){
  const f = msg && msg.file;
  if(!f || !String(f.name||'').trim()) return '';
  const row = (k, v)=> String(v||'').trim()
    ? `<div class="mf-row"><span class="mf-k">${esc(k)}</span><span class="mf-v">${esc(String(v).trim())}</span></div>` : '';
  return `<div class="msg-file">
      <div class="mf-main">
        <div class="mf-name">${esc(String(f.name).trim())}</div>
        ${row('날짜', f.date)}${row('유효기간', f.expire)}${row('용량', f.size)}
      </div>
      <div class="mf-dl">${FILE_DL_SVG}</div>
    </div>`;
}
function hasFile(msg){ return !!(msg && msg.file && String(msg.file.name||'').trim()); }

function renderMessages(room){
  const box = $('#messages'); box.innerHTML = '';
  const all = room.messages || [];
  const showInvite = inviteShown(room) && !!inviteTextOf(room);

  /* 각 메시지가 속한 날짜를 먼저 계산 (날짜는 바뀌는 날 첫 메시지에만 입력).
     숨긴 메시지까지 포함해 계산한 뒤에 추려야, 앞 메시지를 숨겨도 날짜 구분선이 남는다 */
  const effAll = [];
  let cd = null;
  all.forEach(m=>{ if(m.date && m.date !== cd) cd = m.date; effAll.push(cd); });

  /* 이 폰의 “나”에게 보이는 것만 남긴다 */
  const keep = myMsgs(room);
  const msgs = [], eff = [];
  all.forEach((m, i)=>{ if(keep.indexOf(m) >= 0){ msgs.push(m); eff.push(effAll[i]); } });

  if(!msgs.length){
    if(showInvite) box.appendChild(inviteEl(room));
    return;
  }

  /* 발신자 + 시간이 같으면 한 묶음. 묶음이 바뀌면 프로필/이름을 다시 보여준다 */
  const gkey = i => (msgs[i].senderName||'') + '|' + (msgs[i].time||'');
  const sameGroup = (a,b) => a>=0 && b<msgs.length && eff[a]===eff[b] && gkey(a)===gkey(b);

  let shownDate = null;
  msgs.forEach((msg, i)=>{
    if(eff[i] && eff[i] !== shownDate){
      const dv = document.createElement('div');
      dv.className = 'date-divider';
      dv.innerHTML = `<span>${esc(formatKoreanDate(eff[i]))}</span>`;
      box.appendChild(dv);
      shownDate = eff[i];
    }
    /* 순서: 날짜 → 초대 문구 → 첫 메시지 */
    if(i === 0 && showInvite) box.appendChild(inviteEl(room));
    const p = partOf(room, msg.senderName) || {name:msg.senderName, isMe:false, avatar:'', silo:0};
    const mine = !!p.isMe;
    const isGroupHead = !sameGroup(i-1, i);
    const isGroupTail = !sameGroup(i, i+1);

    const row = document.createElement('div');
    row.className = 'msg-row' + (mine?' mine':'');
    row.dataset.date = eff[i] || '';

    let avatarHtml = '';
    if(!mine){
      const f = faceOf(p);
      avatarHtml = isGroupHead
        ? (f.avatar ? `<div class="msg-avatar"><img src="${f.avatar}"></div>`
                    : `<div class="msg-avatar">${silhouette(f.silo)}</div>`)
        : `<div class="msg-avatar spacer"></div>`;
    }
    const unread = Number(msg.unread)||0;
    const infoHtml = `<div class="msg-info">
        ${unread>0?`<span class="msg-unread">${unread}</span>`:''}
        ${isGroupTail?`<span class="msg-time">${esc(msg.time||'')}</span>`:''}
      </div>`;
    const photoHtml = msg.image
      ? `<div class="msg-photo" data-photo="${esc(msg.id)}"><img src="${msg.image}" alt="사진"></div>` : '';
    const fileHtml = fileCardHtml(msg);
    const textHtml = msg.text ? `<div class="bubble">${esc(msg.text)}</div>` : '';

    row.innerHTML = `
      ${avatarHtml}
      <div class="msg-body">
        ${(!mine && isGroupHead)?`<div class="msg-sender">${esc(dispName(p.name))}</div>`:''}
        <div class="msg-line">
          <div class="msg-stack">${fileHtml}${photoHtml}${textHtml}</div>
          ${infoHtml}
        </div>
      </div>`;
    const ph = row.querySelector('[data-photo]');
    if(ph) ph.onclick = ()=> openPhoto(msg.image);
    box.appendChild(row);
  });
}

/* 설치가 안 될 때 원인을 한 화면에 모아 보여준다 */
function runDiag(){
  const out = [];
  const ua = navigator.userAgent || '';
  const cm = ua.match(/Chrome\/(\d+)/);
  const cv = cm ? Number(cm[1]) : 0;
  const inApp = /; wv\)|\bwv\b|KAKAOTALK|FBAN|FB_IAB|Instagram|NAVER|Line\//i.test(ua);
  out.push('코드 버전: ' + CODE_VERSION + ' / 파일 버전: ' + DATA_VERSION);
  out.push('브라우저: ' + (cm ? ('Chrome ' + cm[1]) : '크롬 아님 또는 확인 불가'));
  out.push('버전 판정: ' + (cv === 0 ? '확인 불가' : (cv >= 76 ? '앱 설치 지원 버전' : '너무 오래된 버전 — 크롬 업데이트 필요')));
  out.push('내장 브라우저: ' + (inApp ? '예 — 크롬 앱에서 직접 열어야 설치됩니다' : '아니오'));
  out.push('https(보안) 상태: ' + (window.isSecureContext ? '정상' : '아님 — 설치 불가'));
  out.push('서비스워커 지원: ' + (('serviceWorker' in navigator) ? '지원' : '지원 안 함'));
  out.push('서비스워커 상태: ' + swState);
  out.push('설치 신호(beforeinstallprompt): ' + (deferredInstall ? '받음' : '아직 없음'));
  out.push('매니페스트 주소: ' + (document.getElementById('manifestLink').getAttribute('href') || '(없음)'));
  const box = document.getElementById('diagOut');
  box.style.display = 'block';
  box.textContent = out.join('\n') + '\n서버 응답 확인 중…';
  const jobs = [];
  jobs.push(fetch('./sw.js?diag=' + Date.now(), {cache:'no-store'})
    .then(r=> 'sw.js 응답: ' + r.status + ' / ' + (r.headers.get('content-type')||'?'))
    .catch(e=> 'sw.js 응답: 실패 (' + e + ')'));
  const mfHref = document.getElementById('manifestLink').getAttribute('href') || './manifest.webmanifest';
  jobs.push(fetch(mfHref, {cache:'no-store'})
    .then(r=> r.json().then(j=> '매니페스트 응답: ' + r.status + ' / 이름 ' + j.name, ()=> '매니페스트 응답: ' + r.status + ' / 내용 읽기 실패'))
    .catch(()=> '매니페스트 응답: 실패'));
  jobs.push((('serviceWorker' in navigator) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
    .then(rs=> '등록된 서비스워커: ' + rs.length + '개')
    .catch(()=> '등록 목록 확인 실패'));
  Promise.all(jobs).then(extra=>{ box.textContent = out.concat(extra).join('\n'); });
}

/* 관리자 정보란(서비스워커/설치 가능/매니페스트)만 다시 그린다 */
/* ---------- 오프라인 준비 상태 ----------
   “이 폰이 와이파이 없이 열리는가”를 돌려 말하지 않고 그대로 확인한다.
   서비스워커가 돌고 있는지, 그리고 화면 파일이 실제로 폰에 저장돼 있는지 둘 다 본다. */
let offlineState = '확인 중';
/* 폰이 지금 몇 년 몇 월로 알고 있는지 그대로 보여 준다.
   날짜가 틀리면 보안 인증서가 깨져 보여 저장 기능이 통째로 막힌다. */
function phoneClock(){
  try{
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    const txt = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
              + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    const y = d.getFullYear();
    /* 터무니없는 해면 바로 알려 준다 */
    if(y < 2020 || y > 2100) return txt + '  ← 날짜가 틀립니다. 먼저 맞춰 주세요';
    return txt;
  }catch(e){ return '알 수 없음'; }
}
function offlineFiles(){
  /* 캐시에 꼭 들어 있어야 하는 것들 */
  return ['./', './index.html', './manifest.webmanifest', './icons/icon-192.png', './icons/icon-512.png'];
}
function checkOffline(){
  if(!('caches' in window)){ offlineState = '이 브라우저는 지원 안 함'; return Promise.resolve(); }
  return caches.match('./index.html', {ignoreSearch:true})
    .then(hit=>{
      const sw = String(swState);
      const swBad = sw.indexOf('실패') >= 0 || sw.indexOf('지원') >= 0 || sw.indexOf('불가') >= 0;
      /* 오래된 폰에서 가장 흔한 원인 — 폰 날짜가 틀리면 보안 인증서가 깨져 보여
         서비스워커가 아예 등록되지 않는다. 이때는 할 일을 바로 알려 준다. */
      const sslBad = sw.indexOf('SSL') >= 0 || sw.toLowerCase().indexOf('certificate') >= 0
                  || sw.indexOf('인증서') >= 0;
      if(sslBad){
        offlineState = '안 됩니다 — 보안 인증서 오류 (아래 “폰 날짜” 줄을 먼저 확인)';
        return;
      }
      if(!hit){
        offlineState = swBad ? '안 됩니다 — 아래 “서비스워커” 줄을 확인하세요'
                             : '아직 안 됨 — 아래 초록 버튼을 눌러 주세요';
        return;
      }
      if(navigator.serviceWorker && navigator.serviceWorker.controller){
        offlineState = '준비 완료 — 와이파이 없이 열립니다';
      } else if(swBad){
        offlineState = '저장은 됐지만 안 열립니다 — 아래 “서비스워커” 줄을 확인하세요';
      } else {
        offlineState = '거의 다 됨 — 앱을 한 번 껐다 켜면 끝납니다';
      }
    })
    .catch(()=>{ offlineState = '알 수 없음'; });
}
/* 설치하는 사람이 폰을 넘기기 전에 직접 눌러 확인할 수 있게 한다.
   서비스워커가 알아서 저장하지 못한 경우에도 이 버튼으로 강제로 담는다. */
function saveForOffline(){
  if(!('caches' in window)) return Promise.reject(new Error('이 브라우저는 지원 안 함'));
  const ver = (typeof DATA_VERSION !== 'undefined') ? DATA_VERSION : 'dev';
  return caches.open('cs2-kakao-' + ver).then(cache=>{
    const jobs = offlineFiles().map(u=> cache.add(u).catch(()=>null));
    return Promise.all(jobs);
  }).then(checkOffline);
}

function refreshAdminInfo(){
  const sw = document.getElementById('swState');
  if(sw) sw.textContent = swState;
  const of = document.getElementById('offlineState'); if(of) of.textContent = offlineState;
  const sk = document.getElementById('storeKind'); if(sk) sk.textContent = storeKind;
  const ps = document.getElementById('persistState'); if(ps) ps.textContent = persistState;
  const qt = document.getElementById('quotaText'); if(qt) qt.textContent = quotaText;
  const ins = document.getElementById('canInstall');

/* 아이폰·아이패드인지. 아이폰은 설치 신호(beforeinstallprompt)를 주지 않아
   버튼으로 바로 깔 수 없고, 사파리의 공유 메뉴로만 홈 화면에 넣을 수 있다. */
function isIOS(){
  try{
    const ua = navigator.userAgent || '';
    if(/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;  /* 요즘 아이패드 */
  }catch(e){ return false; }
}
/* 아이폰에서 사파리가 아니면(크롬·네이버앱 등) 홈 화면 추가가 안 되거나 제대로 안 열린다 */
function iosNotSafari(){
  const ua = navigator.userAgent || '';
  return isIOS() && /CriOS|FxiOS|EdgiOS|NAVER|KAKAO|Instagram|FBAN|FBAV|Line/i.test(ua);
}
function installApp(){
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(()=>{ deferredInstall = null; });
    return;
  }
  if(location.protocol === 'file:'){
    toast('파일로 직접 연 상태에서는 설치할 수 없습니다. 로컬 서버(localhost)로 여세요.');
    return;
  }
  if(!window.isSecureContext){
    toast('localhost 또는 https 로 접속해야 앱 설치가 가능합니다.');
    return;
  }
  if(isIOS()){
    toast(iosNotSafari()
      ? '아이폰은 사파리에서만 설치됩니다. 이 주소를 사파리로 연 뒤 공유 ⤴ → “홈 화면에 추가”를 누르세요.'
      : '사파리 아래쪽 공유 ⤴ → “홈 화면에 추가”를 누르세요.');
    return;
  }
  toast('크롬 메뉴 ⋮ → “앱 설치” 또는 “홈 화면에 추가”를 눌러주세요.');
}

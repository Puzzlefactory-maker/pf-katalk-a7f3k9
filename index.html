/* ----- 끌어서 순서 바꾸기 (마우스·터치 공용) ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){
      if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; }
      return;
    }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true;
      el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        const mid = r.top + r.height/2;
        if(y < mid) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

/* ----- 분류 화면의 버튼 연결 ----- */
function uniqueName(existing, base){
  let n = base, i = 2;
  while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; }
  return n;
}
function keysUnderC1(c1){
  const out = [];
  (c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>out.push(k)));
  return out;
}
function deleteListByKey(key){
  const L = listByKey(key);
  if(!L) return;
  const cur = data.lists[listIdx];
  const i = data.lists.indexOf(L);
  data.lists.splice(i, 1);
  treeRemoveList(key);
  const ni = data.lists.indexOf(cur);
  listIdx = (ni >= 0) ? ni : Math.max(0, Math.min(i, data.lists.length - 1));
}
function reorderListsByTree(){
  const cur = data.lists[listIdx];
  const seen = {}, out = [];
  data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>{
    const L = listByKey(k);
    if(L && !seen[normKey(L.key)]){ seen[normKey(L.key)] = 1; out.push(L); }
  })));
  data.lists.forEach(L=>{ if(!seen[normKey(L.key)]) out.push(L); });
  data.lists = out;
  const i = data.lists.indexOf(cur);
  listIdx = (i >= 0) ? i : 0;
}

    if(nKey){
      let keyTouched = false;
      nKey.oninput = ()=>{ keyTouched = true; };
      nName.oninput = ()=>{ if(!keyTouched) nKey.value = makeKeyNow(); };
    }
    const auto = $('#nodeAuto');
    if(auto) auto.onclick = ()=>{ if(nKey){ nKey.value = makeKeyNow(); nKey.oninput = ()=>{}; } };
    nSave.onclick = ()=>{
      const nameVal = $('#nodeName').value.trim();
      if(!nameVal){ toast('이름을 입력하세요'); return; }
      if(nKey && !nKey.value.trim()) nKey.value = makeKeyNow();   /* 비어 있으면 자동 생성 */
      if(editingNode.indexOf('c1:') === 0){
        const node = data.tree.find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else if(editingNode.indexOf('P:') === 0){
        const L = curList();
        const p = personById(L, editingNode.slice(2));
        if(p && !renamePerson(L, p, nameVal)){ toast('이름을 바꾸지 못했습니다'); return; }
      } else if(editingNode.indexOf('c2:') === 0){
        const c1 = curC1();
        const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
        if(node){
          node.name = nameVal;
          const L = listsOfCat(node)[0];
          if(L){
            L.label = nameVal;
            const oldKey = L.key;
            const newKey = sanitizeKey(nKey ? nKey.value : '');
            if(newKey && normKey(newKey) !== normKey(oldKey)){
              if(data.lists.some(x=>x !== L && normKey(x.key) === normKey(newKey))){
                toast('같은 주소용 이름이 이미 있습니다'); return;
              }
              L.key = newKey;
              L.aliases = (L.aliases||[]).concat([oldKey]).filter(a=>normKey(a) !== normKey(newKey));
              if(viewAs[oldKey]){ viewAs[newKey] = viewAs[oldKey]; delete viewAs[oldKey]; saveView(); }
              treeRenameListKey(oldKey, newKey);
              try{
                if(savedListKey() && normKey(savedListKey()) === normKey(oldKey)) localStorage.setItem(LAST_KEY, newKey);
              }catch(e){}
            }
          }
        }
      }
      editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree.push({ id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 대분류'), children:[] });
    } else if(!c2){
      const node = { id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 중분류'), lists:[] };
      c1.children.push(node);
      listOfCat(c1, node);            /* 중분류마다 카카오톡 한 벌을 만들어 둔다 */
    } else {
      const L = listOfCat(c1, c2);
      const list = peopleOf(L);                 /* 먼저 명단을 확정한 뒤에 넣는다 */
      const nm = uniqueName(list.map(p=>p.name), '새 인물');
      const np = { id:newPersonId(L, nm), name:nm, avatar:'', silo:list.length % 2 };
      list.push(np);
      editingNode = 'P:' + np.id;      /* 만들자마자 이름을 바로 고칠 수 있게 연다 */
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, keys, removeIt;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; keys = keysUnderC1(node);
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = (c1.children||[]).findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; keys = (node.lists||[]).slice();
      removeIt = ()=> c1.children.splice(i, 1);
    }
    if(keys.length && keys.length >= data.lists.length){
      toast('목록은 최소 1개 필요합니다. 다른 분류에 목록을 남겨두세요.');
      return;
    }
    let rooms = 0;
    keys.forEach(k=>{ const L = listByKey(k); if(L) rooms += (L.rooms||[]).length; });
    const doIt = ()=>{
      const openKey = curList() ? curList().key : '';
      keys.forEach(k=>deleteListByKey(k));
      removeIt();
      if(keys.some(k=>normKey(k) === normKey(openKey))){ adminListPicked = false; adminRoomId = ''; }
      save(); renderAdminHome(); toast('삭제되었습니다');
    };
    if(rooms) confirmDialog('“' + node.name + '” 안에 대화방 ' + rooms + '개가 있습니다.\n대화 내용까지 모두 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 분류를 삭제할까요?', doIt);
  });

  /* 중분류 복제 = 카카오톡 한 벌을 통째로 복사 */
  body.querySelectorAll('[data-lcopy]').forEach(b=> b.onclick = ()=>{
    const src = listByKey(b.dataset.lcopy);
    const c1 = curC1();
    if(!src || !c1) return;
    const c = catOfList(src.key);
    const nodeName = uniqueName(c1.children.map(x=>x.name), (c ? c.c2.name : listLabel(src)) + ' 사본');
    const copy = deepCopy(src);
    copy.label = nodeName;
    copy.aliases = []; copy.aliasMe = {};
    copy.key = makeListKey(c1.name, nodeName, '', null);
    copy.rooms.forEach(r=>{ r.id = id(); r.participants.forEach(p=>p.id = id()); r.messages.forEach(m=>m.id = id()); });
    data.lists.push(copy);
    const at = c ? (c1.children.indexOf(c.c2) + 1) : c1.children.length;
    c1.children.splice(at, 0, { id:id(), name:nodeName, lists:[copy.key] });
    save(); renderAdminHome(); toast('복제되었습니다');
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree = order.map(v=>data.tree.find(c=>c.id === v)).filter(Boolean);
    } else if(!c2){
      c1.children = order.map(v=>(c1.children||[]).find(c=>c.id === v)).filter(Boolean);
      reorderListsByTree();
    } else {
      const L = curList();
      L.people = order.map(v=>peopleOf(L).find(p=>p.id === v)).filter(Boolean)
        .concat(peopleOf(L).filter(p=>order.indexOf(p.id) < 0));
    }
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
}

/* ----- 다른 대화 목록의 대화방 불러오기 (분류를 따라 폴더처럼 이동) ----- */
let impPath = [];   /* [] | [대분류id] | [대분류id, 중분류id] */
function importRoomPanel(){
  const c1 = impPath[0] ? data.tree.find(c=>c.id === impPath[0]) : null;
  const c2 = (c1 && impPath[1]) ? (c1.children||[]).find(c=>c.id === impPath[1]) : null;
  const L  = c2 ? listsOfCat(c2)[0] : null;
  let rows = '';

  if(!c1){
    if(!data.tree.length) rows = '<div class="hint" style="margin:0">분류가 없습니다.</div>';
    data.tree.forEach(node=>{
      const cnt = countInCat1(node);
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">중분류 ${cnt.subs}개 · 목록 ${cnt.lists}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else if(!c2){
    if(!(c1.children||[]).length) rows = '<div class="hint" style="margin:0">중분류가 없습니다.</div>';
    (c1.children||[]).forEach(node=>{
      const x = listsOfCat(node)[0];
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0"><div class="rname">${esc(node.name)}</div>
              <div class="rsub">대화방 ${x ? x.rooms.length : 0}개</div></div>
            <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button>
          </div>
        </div>`;
    });
  } else {
    if(!L) rows = '<div class="hint" style="margin:0">이 중분류에는 내용이 없습니다.</div>';
    else if(!L.rooms.length) rows = '<div class="hint" style="margin:0">이 중분류에는 대화방이 없습니다.</div>';
    else L.rooms.forEach((r, ri)=>{
      const last = r.messages[r.messages.length-1];
      const same = (L === curList());
      rows += `
        <div class="admin-list-item">
          <div class="top">
            <div style="min-width:0">
              <div class="rname">${esc(roomLabel(r))}${r.isGroup?' <span class="rsub" style="display:inline">· 단톡방</span>':''}</div>
              <div class="rsub">참여자 ${r.participants.length}명 · 메시지 ${r.messages.length}개</div>
              <div class="rsub">${esc(previewText(last) || '(내용 없음)')}</div>
            </div>
            ${same ? '<span class="rsub">지금 중분류</span>'
                   : `<button class="btn btn-primary btn-sm" data-imp="${esc(L.key)}:${ri}">불러오기</button>`}
          </div>
        </div>`;
    });
  }

  const crumb = [c1 && c1.name, c2 && c2.name].filter(Boolean).join(' › ') || '전체 분류';
  return `
    <div style="background:#f7f9fb;border:1px solid #e3e7ec;border-radius:10px;padding:10px;margin-bottom:10px">
      <div class="hint" style="margin:0 0 8px">다른 중분류의 대화방을 <b>참여자·대화 내용 그대로</b> 여기(<b>${esc(listLabel(curList()))}</b>)로 복사합니다. 원본은 그대로 남습니다.
        참여자 이름이 같으면 이 중분류의 인물과 자동으로 이어집니다.</div>
      <div class="crumb">
        ${impPath.length ? '<button class="btn btn-ghost btn-sm" id="impUp">↑ 상위 폴더</button>' : ''}
        <span class="crumb-txt">${esc(crumb)}</span>
      </div>
      ${rows}
      <button class="btn btn-ghost btn-sm btn-block" id="importRoomClose">닫기</button>
    </div>`;
}

          (관리자 편집 화면 글씨는 바뀌지 않습니다. 너무 줄이면 읽기 어려우니 보통 60~100% 안에서 맞추세요.)</div>
      </div>
    </div>

    ${(wideAdmin() || !adminListPicked) ? '' : roomListHtml()}
    <div class="admin-section">
      <h3>백업 / 복원</h3>
      <div class="hint" style="margin-top:0;margin-bottom:10px">모든 대화 목록을 파일 하나로 내보내고, 다시 불러올 수 있습니다. 새 파일을 설치해 내용이 초기화된 뒤에도 이 파일로 되살릴 수 있습니다.</div>
      <button class="btn btn-ghost btn-block" id="exportBtn">내보내기 (파일 저장)</button>
      <button class="btn btn-ghost btn-block" id="importBtn">불러오기 (파일 열기)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="btn btn-yellow btn-block" id="exportHtmlBtn">새 index.html 만들기</button>
      <div class="hint">지금 내용을 그대로 담은 배포용 index.html 을 만듭니다. 이 파일로 폴더의 index.html 을 바꾸면, 다른 폰에 설치할 때 이 내용이 들어갑니다.</div>
    </div>`;
  const scroller = wideAdmin() ? body : $('#adminBody');
  const prevScroll = resetScroll ? 0 : scroller.scrollTop;
  body.innerHTML = html;
  scroller.scrollTop = prevScroll;
  renderPane2();
  return finishAdminHome(body);
}

/* 대화방 목록 — PC에서는 2번째 칸, 모바일에서는 사이드바 아래에 붙는다 */
function roomListHtml(){
  const L = curList();
  let html = `
    <div class="admin-section">
      <h3>대화방 목록
        <span class="row-actions">
          <button class="btn btn-yellow btn-sm" id="addRoom">＋ 새 대화방</button>
          <button class="btn btn-ghost btn-sm" id="importRoomBtn">대화방 불러오기</button>
        </span>
      </h3>
      ${importOpen ? importRoomPanel() : ''}
      <div class="field" style="margin-bottom:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin:0">
          <input type="checkbox" id="ed-autoSort" ${L.autoSort!==false?'checked':''} style="width:auto">
          시간순 자동 정렬 (최신 대화가 위로)
        </label>
        <div class="hint" style="margin-top:4px">고정(📌)한 방은 항상 맨 위입니다.
          ${L.autoSort!==false
            ? '자동 정렬이 켜져 있어 아래 ▲▼ 순서는 지금 화면에 적용되지 않습니다. 직접 순서를 정하려면 위 체크를 끄세요.'
            : '지금은 아래 ▲▼ 순서 그대로 보입니다.'}</div>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label>“오늘”로 볼 기준 날짜 (비우면 실제 오늘)</label>
        <div class="row-actions">
          <input id="ed-today" style="flex:1;min-width:120px" placeholder="20260504" value="${esc(L.today||'')}">
          <button class="btn btn-ghost btn-sm" id="ed-todayClear" ${L.today?'':'disabled'}>비우기</button>
        </div>
        <div class="hint" style="margin-top:4px">지금 기준 <b>${esc(formatKoreanDate(`${refToday().y}-${String(refToday().m).padStart(2,'0')}-${String(refToday().d).padStart(2,'0')}`))}</b>${refToday().fixed?' (지정됨)':' (실제 오늘)'}<br>
          이 날짜의 메시지는 <b>시간</b>, 하루 전은 <b>어제</b>, 그 이전은 <b>9월 7일</b>, 해가 다르면 <b>2019. 3. 19.</b> 로 표시됩니다.</div>
      </div>`;
  if(!L.rooms.length){
    html += `<div class="hint">대화방이 없습니다. 새 대화방을 추가하세요.</div>`;
  }
  L.rooms.forEach((room, idx)=>{
    html += `
      <div class="admin-list-item ${room.id===adminRoomId?'picked':''}">
        <div class="top">
          <div>
            <div class="rname">${esc(roomLabel(room))} ${room.isGroup?'<span class="rsub" style="display:inline">· 단톡방</span>':''}${(room.only&&room.only.length)?'<span class="rsub" style="display:inline">· 👁일부만</span>':''}${(room.vis&&Object.keys(room.vis).length)?'<span class="rsub" style="display:inline">· 👤범위</span>':''}</div>
            <div class="rsub">${esc((room.participants||[]).map(p=>p.name).join(', '))}</div>
            <div class="rsub">메시지 ${room.messages.length}개 · 목록 표시 시간 <b>${esc(listTimeLabel(room)||'-')}</b></div>
          </div>
          <div class="row-actions">
            <button class="btn ${room.id===adminRoomId?'btn-yellow':'btn-ghost'} btn-sm" data-edit="${room.id}">${room.id===adminRoomId?'편집 중':'편집'}</button>
            <button class="btn btn-danger btn-sm" data-del="${room.id}">삭제</button>
          </div>
        </div>
        <div class="row-actions" style="margin-top:8px">
          <button class="btn btn-ghost btn-sm" data-up="${room.id}" ${idx===0?'disabled':''}>▲ 위로</button>
          <button class="btn btn-ghost btn-sm" data-down="${room.id}" ${idx===L.rooms.length-1?'disabled':''}>▼ 아래로</button>
        </div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

/* 2번째 칸: (PC) 대화방 목록 + 선택한 방 편집 / (모바일) 선택한 방 편집만 */
function renderPane2(){
  const pane = $('#paneRoom');
  if(!pane) return;
  const room = (adminListPicked && adminRoomId) ? findRoom(adminRoomId) : null;
  if(!room) adminRoomId = '';
  const keep = pane.scrollTop;
  if(!adminListPicked){
    /* 상위 폴더를 보고 있는 중 — 어떤 목록도 고르지 않은 상태 */
    pane.innerHTML = wideAdmin()
      ? '<div class="pane-empty">왼쪽 <b>대화 목록</b>에서 중분류의 <b>열기</b>를 누르면<br>그 중분류의 대화방이 여기 표시됩니다.</div>'
      : '';
    const m0 = $('#paneMsgs'); if(m0) m0.innerHTML = '';
    const ab0 = $('#adminBody'); if(ab0) ab0.classList.remove('room-open');
    return;
  }
  pane.innerHTML = (wideAdmin() ? roomListHtml() : '')
    + (room ? roomEditorHtml(room) : (wideAdmin() ? '<div class="pane-empty">위 목록에서 대화방의 <b>편집</b>을 누르세요.</div>' : ''));
  pane.scrollTop = keep;
  if(wideAdmin()) bindRoomListSection($('#adminBody'));
  if(room) bindRoomEditor(room, room.id);
  else { const m = $('#paneMsgs'); if(m) m.innerHTML = ''; }
  const ab = $('#adminBody');
  if(ab) ab.classList.toggle('room-open', !!room);
}

function finishAdminHome(body){

  if(location.protocol === 'file:') $('#mfMode').textContent = '파일 직접 열기 — 설치 불가';
  else refreshAdminInfo();
  $('#exportHtmlBtn').onclick = exportHtml;
  const eht = $('#exportHtmlTop'); if(eht) eht.onclick = exportHtml;
  const so = $('#saveOffline');
  if(so) so.onclick = ()=>{
    toast('저장 중…');
    saveForOffline()
      .then(()=>{ refreshAdminInfo();
        toast(offlineState.indexOf('준비 완료') === 0 || offlineState.indexOf('거의') === 0
              ? '저장했습니다 — ' + offlineState
              : '저장하지 못했습니다 — ' + offlineState); })
      .catch(e=>{ toast('저장하지 못했습니다: ' + ((e && e.message) ? e.message : e)); });
  };
  $('#checkUpdate').onclick = ()=>{ toast('확인 중…'); checkForUpdate(true); };
  $('#saveAppName').onclick = ()=>{
    data.appName = $('#ed-appName').value.trim() || '채팅';
    save(); applyAppIdentity();
    const nn = $('#nameNow'); if(nn) nn.textContent = appNameOf();
    if(location.protocol.indexOf('http') === 0){
      toast('앱 이름 저장됨 · 적용을 위해 새로고침합니다');
      setTimeout(()=> location.reload(), 900);
    } else {
      toast('앱 이름 저장됨');
    }
  };
  $('#installBtn').onclick = installApp;
  $('#diagBtn').onclick = runDiag;
  $('#resetFile').onclick = ()=> confirmDialog('폰에서 수정한 내용을 모두 지우고 파일 원본으로 되돌릴까요?', ()=>{
    data = normalize(deepCopy(EMBEDDED_DATA)); listIdx = 0; baseFp = fingerprint(data);
    save(); renderAdminHome(); toast('파일 원본으로 되돌렸습니다');
  });

  bindTreeSection(body);

  $('#saveListTitle').onclick = ()=>{ curList().title = $('#ed-listTitle').value; save(); toast('저장됨'); renderAdminHome(); };
  $('#adToAll').onclick = applyAdToAll;
  $('#saveChrome').onclick = ()=>{
    const C = curList();
    C.chipText = $('#ed-chipText').value;
    C.ad = C.ad || {};
    C.ad.show = $('#ed-adShow').checked;
    C.ad.top = $('#ed-adTop').value; C.ad.head = $('#ed-adHead').value; C.ad.foot = $('#ed-adFoot').value;
    data.adDefault = JSON.parse(JSON.stringify(C.ad));   /* 새로 만드는 목록의 기본 광고로도 저장 */
    save(); toast('저장됨 · 새 목록에도 이 광고가 들어갑니다'); renderChrome();
  };
  $('#ed-adImg').onclick = ()=> $('#ed-adImgFile').click();
  $('#ed-adImgFile').onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    resizeImageFit(file, 320, url=>{ const C = curList(); C.ad = C.ad||{}; C.ad.img = url; save(); toast('광고 이미지 저장됨'); renderAdminHome(); });
    e.target.value='';
  };
  $('#ed-adImgClear').onclick = ()=>{ const C = curList(); if(C.ad){ C.ad.img=''; save(); renderAdminHome(); } };
  $('#saveBottomPad').onclick = ()=>{
    setDevicePad(Math.max(0, Number($('#ed-bottomPad').value)||0));
    applyBottomPad(); renderAdminHome(); toast('이 기기의 하단 여백을 저장했습니다');
  };
  $('#clearBottomPad').onclick = ()=>{
    setDevicePad(null); applyBottomPad(); renderAdminHome(); toast('파일 기본값으로 되돌렸습니다');
  };
  const p2f = $('#padToFile');
  if(p2f) p2f.onclick = ()=>{
    const v = Math.max(0, Number($('#ed-bottomPad').value)||0);
    data.lists.forEach(L2=>{ L2.bottomPad = v; });
    save(); renderAdminHome(); toast('파일 기본값으로도 저장했습니다 (새 파일을 만들어 올려야 다른 폰에 적용됩니다)');
  };

  /* 화면 테마 — 누르면 바로 바뀌고 이 기기에 저장된다 */
  const pickTheme = (v)=>{
    setDeviceTheme(v); applyTheme(); renderAdminHome();
    toast(v === 'dark' ? '어두운 화면으로 바꿨습니다' : '밝은 화면으로 바꿨습니다');
  };
  $('#themeLight').onclick = ()=> pickTheme('light');
  $('#themeDark').onclick  = ()=> pickTheme('dark');
  $('#themeClear').onclick = ()=>{
    setDeviceTheme(''); applyTheme(); renderAdminHome(); toast('파일 기본값으로 되돌렸습니다');
  };
  /* 글자 · 프로필 크기 — 움직이면 바로 적용되고 이 기기에 저장된다 */
  const bindPct = (sliderId, labelId, key, btnAttr)=>{
    const sl = $('#' + sliderId), lb = $('#' + labelId);
    const show = ()=>{ if(lb) lb.textContent = devicePct(key) + '%'; };
    if(sl){
      const run = e=>{ setDevicePct(key, e.target.value); applySizes(); show(); };
      sl.oninput = run; sl.onchange = run;
    }
    document.querySelectorAll('[' + btnAttr + ']').forEach(b=> b.onclick = ()=>{
      setDevicePct(key, b.getAttribute(btnAttr));
      applySizes(); if(sl) sl.value = devicePct(key); show();
    });
  };
  bindPct('fontPct', 'fontPctLabel', FONT_KEY, 'data-fontset');
  bindPct('facePct', 'facePctLabel', FACE_KEY, 'data-faceset');
  const szr = $('#sizeReset');
  if(szr) szr.onclick = ()=>{
    setDevicePct(FONT_KEY, 100); setDevicePct(FACE_KEY, 100);
    applySizes(); renderAdminHome(); toast('글자·프로필 크기를 100%로 되돌렸습니다');
  };

  const t2f = $('#themeToFile');
  if(t2f) t2f.onclick = ()=>{
    data.themeDefault = effTheme();
    save(); renderAdminHome(); toast('파일 기본값으로도 저장했습니다 (새 파일을 만들어 올려야 다른 폰에 적용됩니다)');
  };
  if(!wideAdmin() && adminListPicked) bindRoomListSection(body);
  $('#exportBtn').onclick = exportData;
  $('#importBtn').onclick = ()=> $('#importFile').click();
  $('#importFile').onchange = importData;
}

/* 대화방 목록 칸의 버튼 연결 (PC는 2번째 칸, 모바일은 사이드바) */
function bindRoomListSection(scope){
  const root = scope || $('#adminBody');
  if(!root) return;
  const as = $('#ed-autoSort');
  if(as) as.onchange = e=>{ curList().autoSort = e.target.checked; save(); renderAdminHome(); };
  const tdIn = $('#ed-today');
  if(tdIn) tdIn.onchange = ()=>{
    const parsed = parseDateInput(tdIn.value);
    if(parsed === null){ toast('날짜를 알아볼 수 없습니다. 예: 20260504'); tdIn.value = curList().today || ''; return; }
    curList().today = parsed; save(); renderAdminHome();
  };
  const tdC = $('#ed-todayClear'); if(tdC) tdC.onclick = ()=>{ curList().today = ''; save(); renderAdminHome(); };
  const ar = $('#addRoom'); if(ar) ar.onclick = addRoom;
  const irb = $('#importRoomBtn'); if(irb) irb.onclick = ()=>{ importOpen = !importOpen; if(importOpen) impPath = []; renderAdminHome(); };
  const irc = $('#importRoomClose'); if(irc) irc.onclick = ()=>{ importOpen = false; renderAdminHome(); };
  const iup = $('#impUp'); if(iup) iup.onclick = ()=>{ impPath.pop(); renderAdminHome(); };
  root.querySelectorAll('[data-impgo]').forEach(b=> b.onclick = ()=>{ impPath.push(b.dataset.impgo); renderAdminHome(); });
  root.querySelectorAll('[data-imp]').forEach(b=> b.onclick = ()=>{
    const raw = String(b.dataset.imp);
    const cut = raw.lastIndexOf(':');
    const srcList = listByKey(raw.slice(0, cut));
    const src = srcList && srcList.rooms[+raw.slice(cut+1)];
    if(!src){ toast('원본 대화방을 찾을 수 없습니다'); return; }
    const copy = deepCopy(src);
    copy.id = id();
    copy.per = {};                  /* 안읽음·고정·알림은 이 중분류의 인물 기준으로 새로 정한다 */
    (copy.participants||[]).forEach(p=>{ p.id = id(); delete p.isMe; });
    (copy.messages||[]).forEach(m=> m.id = id());
    curList().rooms.push(copy);
    ensurePeople(curList());
    save();
    renderAdminHome();
    toast(`“${roomLabel(copy)}” 대화방을 불러왔습니다`);
  });
  root.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> editRoom(b.dataset.edit));
  root.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> delRoom(b.dataset.del));
  root.querySelectorAll('[data-up]').forEach(b=> b.onclick = ()=> moveRoom(b.dataset.up,-1));
  root.querySelectorAll('[data-down]').forEach(b=> b.onclick = ()=> moveRoom(b.dataset.down,1));
}

function moveList(i, dir){
  const j = i + dir;
  if(j < 0 || j >= data.lists.length) return;
  const cur = data.lists[listIdx];
  [data.lists[i], data.lists[j]] = [data.lists[j], data.lists[i]];
  listIdx = data.lists.indexOf(cur);
  save(); renderAdminHome();
}
function addRoom(){
  const L = curList();
  const ps = peopleOf(L);
  /* 이 기기의 “나”(없으면 첫 인물)와 그다음 인물로 시작한다 */
  const first = personById(L, effMeId()) || ps[0] || null;
  const second = ps.find(p=> p !== first) || null;
  const mk = p => ({ id:id(), name:p.name });   /* 사진은 인물 명단에만 둔다 */
  const parts = [];
  if(first) parts.push(mk(first));
  if(second) parts.push(mk(second));
  while(parts.length < 2) parts.push({ id:id(), name:'', silo:0, avatar:'' });
  const room = { id:id(), name:'', isGroup:false, per:{}, participants:parts, messages:[] };
  L.rooms.push(room); save(); editRoom(room.id);
}
function delRoom(rid){
  const room = findRoom(rid);
  confirmDialog(`“${room?roomLabel(room):''}” 대화방을 삭제할까요?`, ()=>{
    const L = curList();
    L.rooms = L.rooms.filter(r=>r.id!==rid); save(); renderAdminHome(); toast('삭제되었습니다');
  });
}
function moveRoom(rid, dir){
  const L = curList();
  const i = L.rooms.findIndex(r=>r.id===rid);
  const j = i+dir;
  if(j<0||j>=L.rooms.length) return;
  [L.rooms[i], L.rooms[j]] = [L.rooms[j], L.rooms[i]];
  save(); renderAdminHome();
}

/* 3번째 칸: 대화 내용 */
/* 편집 화면에서 오른쪽(노란 말풍선)에 놓을 사람 —
   이 기기에서 고른 “나”가 이 방에 있으면 그 사람, 아니면 참여자 맨 위 사람 */
function editorMe(room){
  const me = personById(curList(), effMeId());
  if(me && inRoom(room, me.name)) return me.name;
  return ((room.participants||[])[0] || {}).name || '';
}
function otherNamesOf(room){
  const me = normKey(editorMe(room));
  return (room.participants||[]).filter(p=>normKey(p.name) !== me);
}
function lastOtherName(room){
  const others = otherNamesOf(room);
  const me = normKey(editorMe(room));
  for(let i=room.messages.length-1; i>=0; i--){
    const n = room.messages[i].senderName;
    if(n && normKey(n) !== me && partOf(room, n)) return n;
  }
  return others[0] ? others[0].name : '';
}
function renderRoomMessages(rid){
  const room = findRoom(rid);
  if(!room){ const m = $('#paneMsgs'); if(m) m.innerHTML = ''; return; }
  const others = otherNamesOf(room);
  const meName = editorMe(room) || '나';
  const lastOther = lastOtherName(room);
  $('#paneMsgs').innerHTML = `
    <div class="admin-section">
      <h3>대화 내용</h3>
      <div class="hint" style="margin-top:0">시간은 <b>1450</b> → 오후 2:50, <b>930</b> → 오전 9:30 처럼 숫자만 넣으면 됩니다.<br>
        날짜는 <b>20260504</b> → 2026-05-04 로 바뀌며, <b>바뀌는 날의 첫 메시지</b>에만 넣으면 됩니다.</div>
      <div id="msgList"></div>
      <div class="add-row">
        <div class="left">
          ${room.isGroup && others.length > 1
            ? `<select id="addWho">${others.map(p=>`<option ${p.name===lastOther?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`
            : ''}
          <button class="btn btn-ghost" id="addMsgOther">＋ ${room.isGroup && others.length>1 ? '상대 메시지' : esc(lastOther || '상대방')}</button>
        </div>
        <button class="btn btn-yellow right" id="addMsgMine">＋ ${esc(meName)}</button>
      </div>
    </div>`;
  bindMsgSection(room, rid);
  renderMsgEditors(room, rid);
}

/* 대화 내용 칸의 ＋ 버튼 연결 */
function bindMsgSection(room, rid){
  const others = otherNamesOf(room);
  const meName = editorMe(room) || '나';
  const lastOther = lastOtherName(room);
  const addMsgBy = who=>{
    const lastMsg = room.messages[room.messages.length-1];
    room.messages.push({id:id(), senderName:who, text:'', image:'',
      time:(lastMsg?lastMsg.time:''), date:'', unread:0});
    save(); renderRoomMessages(rid); renderPane2();
    const last = $('#msgList') ? $('#msgList').lastElementChild : null;
    if(last) last.scrollIntoView({block:'center'});
  };
  const ao = $('#addMsgOther');
  if(ao) ao.onclick = ()=>{
    const sel = $('#addWho');
    addMsgBy(sel ? sel.value : (lastOther || (others[0]||{}).name || ''));
  };
  const am = $('#addMsgMine');
  if(am) am.onclick = ()=> addMsgBy(meName);
}

/* 대화방 편집 칸(2번째)의 버튼 연결 */
function bindRoomEditor(room, rid){
  const back = $('#backToRooms');
  if(back) back.onclick = ()=>{ save(); clearRoomPanes(); renderAdminHome(true); };
  const rn = $('#rn'); if(rn) rn.oninput = e=>{ room.name = e.target.value; save(); };
  $('#rg').onchange = e=>{ room.isGroup = e.target.checked; syncRoomName(room); save(); editRoom(rid); };
  $('#ropen').onchange = e=>{ room.openChat = e.target.checked; save(); };

  /* 이 방을 볼 사람 (기본은 참여자 모두) */
  const onlyAll = $('#onlyAll');
  if(onlyAll) onlyAll.onchange = ()=>{
    if(onlyAll.checked){ room.only = []; }
    else {
      /* 끄면 일단 지금 참여자 전원을 고른 상태로 시작한다 */
      room.only = room.participants.map(p=>{ const q = personByName(curList(), p.name); return q ? q.id : ''; }).filter(Boolean);
    }
    save(); editRoom(rid);
  };
  document.querySelectorAll('#onlyBox [data-only]').forEach(cb=> cb.onchange = ()=>{
    const pid = cb.dataset.only; if(!pid) return;
    if(!Array.isArray(room.only)) room.only = [];
    if(cb.checked){ if(room.only.indexOf(pid) < 0) room.only.push(pid); }
    else room.only = room.only.filter(x=>x !== pid);
    save();
  });

  /* 사람마다 보이는 대화 범위 (전부 / 전체 보지 않기 / 일부만) */
  document.querySelectorAll('.vis-person').forEach(boxEl=>{
    const pid = boxEl.dataset.vp;
    if(!pid) return;

    boxEl.querySelectorAll('[data-vm]').forEach(r=> r.onchange = ()=>{
      if(!r.checked) return;
      const mode = r.dataset.vm;
      /* “일부만”을 처음 켜면 아직 아무것도 안 고른 상태로 시작한다 */
      setVisMode(room, pid, mode);
      save(); editRoom(rid);
    });

    const rows = ()=> Array.prototype.slice.call(boxEl.querySelectorAll('[data-vmsg]'));
    const paint = cb => { const row = cb.closest('.vis-row'); if(row) row.classList.toggle('on', cb.checked); };
    rows().forEach(cb=> cb.onchange = ()=> paint(cb));

    const bAll = boxEl.querySelector('[data-vall]');
    if(bAll) bAll.onclick = ()=> rows().forEach(cb=>{ cb.checked = true; paint(cb); });
    const bNone = boxEl.querySelector('[data-vnone]');
    if(bNone) bNone.onclick = ()=> rows().forEach(cb=>{ cb.checked = false; paint(cb); });
    const bFrom = boxEl.querySelector('[data-vfrom]');
    if(bFrom) bFrom.onclick = ()=>{
      const list = rows();
      const first = list.findIndex(cb=> cb.checked);
      if(first < 0){ toast('먼저 시작할 대화 하나를 체크하세요'); return; }
      list.forEach((cb, i)=>{ cb.checked = (i >= first); paint(cb); });
    };

    const bSave = boxEl.querySelector('[data-vsave]');
    if(bSave) bSave.onclick = ()=>{
      const picked = rows().filter(cb=> cb.checked).map(cb=> cb.dataset.vmsg);
      if(!room.vis || typeof room.vis !== 'object') room.vis = {};
      room.vis[pid] = { mode:'some', msgs: picked };
      save(); editRoom(rid);
      toast(picked.length ? ('고른 대화 ' + picked.length + '개만 보이게 저장했습니다')
                          : '아무것도 고르지 않아 이 사람에게는 빈 대화방으로 보입니다');
    };
  });

  const invShow = $('#invShow');
  if(invShow) invShow.onchange = ()=>{ room.inviteShow = invShow.checked; save(); };
  const invText = $('#invText');
  if(invText) invText.oninput = ()=>{ room.inviteText = invText.value; save(); };
  const invReset = $('#invReset');
  if(invReset) invReset.onclick = ()=>{ room.inviteText = ''; save(); editRoom(rid); toast('자동 문구로 되돌렸습니다'); };

  const addSel = $('#addPartSel');
  $('#addPart').onclick = ()=>{
    const L = curList();
    const p = addSel ? personById(L, addSel.value) : null;
    if(!p || inRoom(room, p.name)) return;
    room.participants.push({id:id(), name:p.name});
    save(); editRoom(rid);
  };
  $('#addPartNew').onclick = ()=>{
    const v = $('#newPart').value.trim(); if(!v) return;
    const L = curList();
    let p = personByName(L, v);
    if(!p){ const list = peopleOf(L); p = {id:newPersonId(L, v), name:v, avatar:'', silo:list.length%2}; list.push(p); }
    if(p.extra) delete p.extra;      /* 직접 만든 사람은 단역이 아니다 */
    if(inRoom(room, p.name)){ toast('이미 참여자에 있습니다'); return; }
    room.participants.push({id:id(), name:p.name});
    save(); editRoom(rid);
  };
  /* 단역 한꺼번에 넣기 / 빼기 */
  const bulkDone = (made, room2, rid2)=>{
    if(!room2.isGroup && room2.participants.length > 2){ room2.isGroup = true; syncRoomName(room2); }
    save(); editRoom(rid2);
    toast(made.length ? ('단역 ' + made.length + '명을 넣었습니다 (참여자 ' + room2.participants.length + '명)')
                      : '넣을 이름이 없습니다');
  };
  const bm = $('#bulkMake');
  if(bm) bm.onclick = ()=>{
    const n = Math.max(1, Math.min(500, Number(($('#bulkCount')||{}).value) || 0));
    if(!n){ toast('인원수를 적어주세요'); return; }
    const L = curList();
    const need = n - room.participants.length;      /* 그 인원수가 되도록 채운다 */
    if(need <= 0){ toast('이미 ' + room.participants.length + '명입니다'); return; }
    bulkDone(fillExtras(L, room, need, null), room, rid);
  };
  const ba = $('#bulkAdd');
  if(ba) ba.onclick = ()=>{
    const raw = (($('#bulkNames')||{}).value || '');
    const names = raw.split(/[\n,]/).map(s=>s.trim()).filter(Boolean);
    if(!names.length){ toast('이름을 적어주세요'); return; }
    bulkDone(fillExtras(curList(), room, names.length, names), room, rid);
  };
  const bc = $('#bulkClear');
  if(bc) bc.onclick = ()=>{
    const L = curList();
    /* 먼저 셈만 하고, 확인을 누를 때 실제로 뺀다 */
    const keep = room.participants.filter(pt=> !isExtra(personByName(L, pt.name)));
    const gone = room.participants.length - keep.length;
    if(!gone){ toast('이 방에 단역이 없습니다'); return; }
    confirmDialog('이 방에서 단역 ' + gone + '명을 뺄까요?\n(대화 내용은 그대로 남습니다)', ()=>{
      room.participants = keep;
      /* 어느 방에도 남지 않은 단역은 등장인물 명단에서도 치운다 (주요 인물은 그대로 둔다) */
      L.people = peopleOf(L).filter(p=> !isExtra(p) || roomsOfPerson(L, p.id).length);
      save(); editRoom(rid);
      toast('단역 ' + gone + '명을 뺐습니다');
    }, '빼기');
  };

  renderParticipants(room, rid);
}

function renderParticipants(room, rid){
  const L = curList();
  const box = $('#partList'); box.innerHTML = '';
  /* 단역은 접어 둔다. 100명짜리 단톡방에서 설정 줄이 100개 펼쳐지지 않도록 */
  const mains = room.participants.filter(p=> !isExtra(personByName(L, p.name)));
  const extras = room.participants.filter(p=> isExtra(personByName(L, p.name)));
  mains.forEach(p=>{
    const person = personByName(L, p.name);
    const pid = person ? person.id : '';
    const pv = perOf(room, pid);
    const manual = (typeof pv.unread === 'number' && pv.unread >= 0);
    const face = faceOf(p);
    const row = document.createElement('div');
    row.className = 'part-row';
    const thumb = face.avatar ? `<img src="${face.avatar}">` : silhouette(face.silo);
    row.innerHTML = `
      <div class="part-thumb" title="사진 변경">${thumb}</div>
      <div class="part-info">
        <div class="part-name">
          <input class="part-name-input" data-a="name" value="${esc(p.name)}" placeholder="이름">
          ${pid && pid===meId() ? '<span class="me-tag">이 기기의 나</span>' : ''}
        </div>
        <div class="part-actions">
          <button class="btn btn-ghost btn-sm" data-a="photo">${face.avatar?'사진 변경':'＋ 사진'}</button>
          ${face.avatar?'<button class="btn btn-ghost btn-sm" data-a="photoDel">사진 제거</button>':'<button class="btn btn-ghost btn-sm" data-a="silo">실루엣 색</button>'}
          <button class="btn btn-danger btn-sm" data-a="del">빼기</button>
        </div>
        <div class="part-actions" style="border-top:1px dashed #e3e7ec;margin-top:6px;padding-top:6px">
          <span class="rsub" style="flex-basis:100%">${esc(p.name)} 님의 폰에서 이 방은</span>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px">
            <input type="checkbox" data-a="uman" ${manual?'checked':''} style="width:auto"> 안읽음 직접</label>
          <input type="number" min="0" data-a="unum" style="width:70px;padding:5px 8px"
                 value="${manual ? pv.unread : autoUnreadFor(room, pid)}" ${manual?'':'disabled'}>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px">
            <input type="checkbox" data-a="pin" ${pv.pinned?'checked':''} style="width:auto"> 📌고정</label>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px">
            <input type="checkbox" data-a="mute" ${pv.muted?'checked':''} style="width:auto"> 🔕알림끔</label>
        </div>
      </div>
      <input type="file" accept="image/*" style="display:none" data-a="file">`;

    const nameInput = row.querySelector('[data-a="name"]');
    nameInput.onchange = ()=>{
      const v = nameInput.value.trim();
      if(!v || !person){ nameInput.value = p.name; return; }
      if(renamePerson(L, person, v)){ save(); editRoom(rid); }
      else nameInput.value = p.name;
    };

    const fileInput = row.querySelector('[data-a="file"]');
    const pickPhoto = ()=> fileInput.click();
    row.querySelector('.part-thumb').onclick = pickPhoto;
    row.querySelector('[data-a="photo"]').onclick = pickPhoto;
    fileInput.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      resizeImage(f, FACE_PX, (dataUrl)=>{
        const per = person || personByName(L, p.name);
        if(per){ per.avatar = dataUrl; spreadPerson(L, per); }
        save(); renderParticipants(room, rid); renderMsgEditors(room, rid); toast('사진이 설정되었습니다 (이 인물이 있는 모든 방에 적용)');
      });
      e.target.value = '';
    };
    const delPhoto = row.querySelector('[data-a="photoDel"]');
    if(delPhoto) delPhoto.onclick = ()=>{
      const per = person || personByName(L, p.name);
      if(per){ per.avatar = ''; spreadPerson(L, per); }
      save(); renderParticipants(room, rid); renderMsgEditors(room, rid);
    };
    const siloBtn = row.querySelector('[data-a="silo"]');
    if(siloBtn) siloBtn.onclick = ()=>{
      const per = person || personByName(L, p.name);
      if(per){ per.silo = (per.silo===1)?0:1; spreadPerson(L, per); }
      save(); renderParticipants(room, rid); renderMsgEditors(room, rid);
    };

    /* 사람마다 따로 : 안읽음 · 고정 · 알림 */
    const uMan = row.querySelector('[data-a="uman"]');
    const uNum = row.querySelector('[data-a="unum"]');
    uMan.onchange = ()=>{
      if(uMan.checked){ perSet(room, pid, 'unread', Math.max(0, Number(uNum.value)||0)); uNum.disabled = false; }
      else { perSet(room, pid, 'unread', null); uNum.disabled = true; uNum.value = autoUnreadFor(room, pid); }
      save();
    };
    uNum.oninput = ()=>{ if(uMan.checked){ perSet(room, pid, 'unread', Math.max(0, Number(uNum.value)||0)); save(); } };
    row.querySelector('[data-a="pin"]').onchange = e=>{ perSet(room, pid, 'pinned', e.target.checked); save(); };
    row.querySelector('[data-a="mute"]').onchange = e=>{ perSet(room, pid, 'muted', e.target.checked); save(); };

    row.querySelector('[data-a="del"]').onclick = ()=>{
      if(room.participants.length<=1){ toast('최소 1명은 필요합니다'); return; }
      room.participants = room.participants.filter(x=>x.id!==p.id);
      if(pid && room.per) delete room.per[pid];
      save(); editRoom(rid);
    };
    box.appendChild(row);
  });

  if(!extras.length) return;
  const head = document.createElement('div');
  head.className = 'part-row';
  head.style.cursor = 'pointer';
  head.innerHTML = `<div class="part-info"><div class="part-name" style="font-weight:700">단역 ${extras.length}명</div>
    <div class="rsub">이름만 채운 사람입니다. ${partExtraOpen ? '접기 ▲' : '펼쳐서 이름 고치기 ▼'}</div></div>`;
  head.onclick = ()=>{ partExtraOpen = !partExtraOpen; renderParticipants(room, rid); };
  box.appendChild(head);
  if(!partExtraOpen) return;

  extras.forEach(p=>{
    const person = personByName(L, p.name);
    const pid = person ? person.id : '';
    const row = document.createElement('div');
    row.className = 'part-row';
    row.innerHTML = `
      <div class="part-info" style="display:flex;align-items:center;gap:8px">
        <input class="part-name-input" data-a="name" value="${esc(p.name)}" placeholder="이름" style="flex:1">
        <button class="btn btn-danger btn-sm" data-a="del">빼기</button>
      </div>`;
    const nameInput = row.querySelector('[data-a="name"]');
    nameInput.onchange = ()=>{
      const v = nameInput.value.trim();
      if(!v || !person){ nameInput.value = p.name; return; }
      if(renamePerson(L, person, v)){ save(); editRoom(rid); }
      else nameInput.value = p.name;
    };
    row.querySelector('[data-a="del"]').onclick = ()=>{
      if(room.participants.length<=1){ toast('최소 1명은 필요합니다'); return; }
      room.participants = room.participants.filter(x=>x.id!==p.id);
      if(pid && room.per) delete room.per[pid];
      if(pid && !roomsOfPerson(L, pid).length) L.people = peopleOf(L).filter(x=>x.id !== pid);
      save(); editRoom(rid);
    };
    box.appendChild(row);
  });
}

/* ---------- 사진 크기·화질 ----------
   눈에 띄게 뭉개지지 않는 선에서 조금 낮춰, 파일과 저장 공간을 아낀다.
   더 선명하게 하고 싶으면 숫자를 올리면 된다 (1에 가까울수록 선명·용량 큼). */
const PHOTO_W = 720;   /* 대화 속 사진 가로 최대 */
const PHOTO_Q = 0.72;  /* 대화 속 사진 화질 */
const FACE_PX = 180;   /* 프로필 사진 한 변 (화면에는 46~50px로 보인다) */
const FACE_Q  = 0.76;  /* 프로필 사진 화질 */

/* 비율 유지하며 가로 최대 maxW로 축소 */
function resizeImageFit(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      canvas.width = w; canvas.height = h;
      const cx = canvas.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', PHOTO_Q));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
/* 정사각형으로 잘라 축소 (프로필용) */
function resizeImage(file, size, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side)/2, sy = (img.height - side)/2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      cb(canvas.toDataURL('image/jpeg', FACE_Q));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function renderMsgEditors(room, rid){
  const box = $('#msgList'); box.innerHTML = '';
  if(!room.messages.length){
    box.innerHTML = `<div class="hint">메시지가 없습니다. 아래 <b>＋</b> 버튼으로 추가하세요.</div>`;
  }
  const opts = room.participants.map(p=>p.name);
  const meName = normKey(editorMe(room));
  room.messages.forEach((msg, i)=>{
    const ed = document.createElement('div');
    const mine = !!msg.senderName && normKey(msg.senderName) === meName;
    ed.className = 'msg-editor' + (mine ? ' mine' : '');
    const unread = Number(msg.unread)||0;
    const mf = (msg.file && typeof msg.file === 'object') ? msg.file : {};
    ed.innerHTML = `
      <div class="who">${esc(msg.senderName || '(이름 없음)')}</div>
      <div class="er1">
        <select data-f="sender">
          ${opts.map(n=>`<option ${n===msg.senderName?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
        <input data-f="time" placeholder="1450" value="${esc(msg.time||'')}">
      </div>
      <div class="er1">
        <input data-f="date" style="flex:1;width:auto" placeholder="20260504 (날짜가 바뀔 때만)" value="${esc(msg.date||'')}">
        <button class="btn btn-ghost btn-sm" data-a="dateClear" title="날짜 표시 지우기" ${msg.date?'':'disabled'}>날짜 지움</button>
      </div>
      <div class="stamp" data-f="stamp">${msg.date?esc(formatKoreanDate(msg.date)):''}</div>
      <div class="er2" style="margin-top:8px">
        <textarea data-f="text" placeholder="메시지 내용">${esc(msg.text||'')}</textarea>
      </div>
      <div class="er4">
        ${msg.image?`<div class="er-pv"><img src="${msg.image}"></div>`:''}
        <button class="btn btn-ghost btn-sm" data-a="photo">${msg.image?'사진 변경':'＋ 사진'}</button>
        ${msg.image?'<button class="btn btn-ghost btn-sm" data-a="photoDel">사진 제거</button>':''}
        <input type="file" accept="image/*" style="display:none" data-a="file">
        ${msg.file?'':'<button class="btn btn-ghost btn-sm" data-a="fileAdd">＋ 첨부파일</button>'}
      </div>
      ${msg.file ? `
      <div class="er4" style="flex-wrap:wrap; gap:6px; margin-top:4px">
        <input data-f="fname" style="flex:1 1 100%; width:auto" placeholder="첨부파일 제목 (예: [촬영 구성안] 폐공장 체험(최종)_0714)" value="${esc(mf.name||'')}">
        <input data-f="fdate" style="flex:1 1 30%; width:auto; min-width:110px" placeholder="날짜" value="${esc(mf.date||'')}">
        <input data-f="fexp" style="flex:1 1 30%; width:auto; min-width:110px" placeholder="유효기간" value="${esc(mf.expire||'')}">
        <input data-f="fsize" style="flex:1 1 25%; width:auto; min-width:90px" placeholder="용량" value="${esc(mf.size||'')}">
        <button class="btn btn-ghost btn-sm" data-a="fileDel">첨부파일 제거</button>
      </div>
      <div class="hint" style="margin:2px 0 0">제목을 적으면 채팅 화면에 파일 카드로 보입니다.
        날짜·유효기간·용량은 비워 두면 그 줄이 안 나옵니다. (예: 유효기간 <b>~2025. 7. 18.</b> · 용량 <b>804 KB</b>)</div>` : ''}
      <div class="er3">
        <label><input type="checkbox" data-f="unreadOn" ${unread>0?'checked':''}> 안읽음 숫자</label>
        <input data-f="unread" type="number" min="0" style="width:64px;padding:5px 8px" value="${unread}" ${unread>0?'':'disabled'}>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" data-up="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="btn btn-ghost btn-sm" data-down="${i}" ${i===room.messages.length-1?'disabled':''}>▼</button>
        <button class="btn btn-danger btn-sm" data-del="${i}">삭제</button>
      </div>`;

    /* 보낸 사람이 바뀌면 좌·우 위치도 바로 따라가도록 다시 그린다 */
    ed.querySelector('[data-f="sender"]').onchange = e=>{ msg.senderName = e.target.value; save(); renderMsgEditors(room, rid); };

    const timeInput = ed.querySelector('[data-f="time"]');
    const applyTime = ()=>{
      const parsed = parseTimeInput(timeInput.value);
      if(parsed === null){ toast('시간을 알아볼 수 없습니다. 예: 1450, 930, 오후 2:50'); timeInput.value = msg.time||''; return; }
      msg.time = parsed; timeInput.value = parsed; save();
    };
    timeInput.onchange = applyTime;
    timeInput.onblur = applyTime;

    const dateInput = ed.querySelector('[data-f="date"]');
    const stamp = ed.querySelector('[data-f="stamp"]');
    const applyDate = ()=>{
      const parsed = parseDateInput(dateInput.value);
      if(parsed === null){ toast('날짜를 알아볼 수 없습니다. 예: 20260504, 2026-05-04'); dateInput.value = msg.date||''; return; }
      msg.date = parsed; dateInput.value = parsed;
      stamp.textContent = parsed ? formatKoreanDate(parsed) : '';
      save(); renderMsgEditors(room, rid);
    };
    dateInput.onchange = applyDate;
    ed.querySelector('[data-a="dateClear"]').onclick = ()=>{ msg.date=''; save(); renderMsgEditors(room, rid); };

    ed.querySelector('[data-f="text"]').oninput = e=>{ msg.text = e.target.value; save(); };

    const fileInput = ed.querySelector('[data-a="file"]');
    ed.querySelector('[data-a="photo"]').onclick = ()=> fileInput.click();
    fileInput.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      resizeImageFit(f, PHOTO_W, url=>{ msg.image = url; if(save()) toast('사진이 첨부되었습니다'); renderMsgEditors(room, rid); });
      e.target.value = '';
    };
    const pdel = ed.querySelector('[data-a="photoDel"]');
    if(pdel) pdel.onclick = ()=>{ msg.image=''; save(); renderMsgEditors(room, rid); };

    /* 첨부파일 카드 — “＋ 첨부파일”을 누르면 적는 칸이 열린다 (사진과 같은 방식) */
    const fadd = ed.querySelector('[data-a="fileAdd"]');
    if(fadd) fadd.onclick = ()=>{
      msg.file = { name:'', date:'', expire:'', size:'' };
      save(); renderMsgEditors(room, rid);
      /* 열자마자 제목부터 적을 수 있게 */
      const box2 = document.querySelectorAll('.msg-editor')[i];
      const nm = box2 && box2.querySelector('[data-f="fname"]');
      if(nm) nm.focus();
    };
    /* 칸을 비워도 적는 칸은 그대로 둔다 — 지울 때는 “첨부파일 제거”를 누른다 */
    const setFile = (k, v)=>{
      if(!msg.file || typeof msg.file !== 'object') msg.file = {};
      msg.file[k] = v;
      save();
    };
    const fileKeys = { fname:'name', fdate:'date', fexp:'expire', fsize:'size' };
    Object.keys(fileKeys).forEach(sel=>{
      const el = ed.querySelector('[data-f="' + sel + '"]');
      if(el) el.oninput = e=> setFile(fileKeys[sel], e.target.value);
    });
    const fdel = ed.querySelector('[data-a="fileDel"]');
    if(fdel) fdel.onclick = ()=>{ delete msg.file; save(); renderMsgEditors(room, rid); };

    const uOn = ed.querySelector('[data-f="unreadOn"]');
    const uNum = ed.querySelector('[data-f="unread"]');
    uOn.onchange = e=>{ if(e.target.checked){ msg.unread = Number(msg.unread)||1; uNum.disabled=false; uNum.value=msg.unread; } else { msg.unread=0; uNum.disabled=true; uNum.value=0; } save(); };
    uNum.oninput = e=>{ msg.unread = Math.max(0, Number(e.target.value)||0); save(); };

    ed.querySelector('[data-del]').onclick = ()=>{ room.messages.splice(i,1); save(); renderMsgEditors(room, rid); };
    ed.querySelector('[data-up]').onclick = ()=>{ if(i>0){ [room.messages[i-1],room.messages[i]]=[room.messages[i],room.messages[i-1]]; save(); renderMsgEditors(room, rid);} };
    ed.querySelector('[data-down]').onclick = ()=>{ if(i<room.messages.length-1){ [room.messages[i+1],room.messages[i]]=[room.messages[i],room.messages[i+1]]; save(); renderMsgEditors(room, rid);} };
    box.appendChild(ed);
  });
}

/* ----- 백업/복원 ----- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다.
   화면에 그려둔 내용은 열 때마다 다시 그리므로 비워서 내보낸다. */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  ['#chatList','#messages','#adminBody','#chips','#adbox','#branchList'].forEach(sel=>{
    const el = root.querySelector(sel); if(el) el.innerHTML = '';
  });
  const ap = root.querySelector('#adminBody');
  if(ap) ap.innerHTML = '<div class="apane" id="paneHome"></div><div class="apane" id="paneRoom"></div><div class="apane" id="paneMsgs"></div>';
  const off = (sel, cls)=>{ const el = root.querySelector(sel); if(el) el.classList.remove(cls); };
  off('#adminOverlay','active'); off('#roomScreen','active'); off('#pickBranch','show');
  off('#photoViewer','show'); off('#modePill','show'); off('#confirmBox','show'); off('#toast','show');
  const ls = root.querySelector('#listScreen'); if(ls) ls.removeAttribute('style');
  const ab = root.querySelector('#btnAdmin'); if(ab) ab.removeAttribute('style');
  const pi = root.querySelector('#photoViewerImg'); if(pi) pi.removeAttribute('src');
  const ts = root.querySelector('#toast'); if(ts) ts.textContent = '';
  const ml = root.querySelector('#manifestLink'); if(ml) ml.setAttribute('href','./manifest.webmanifest');
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
/* 호스팅 업체가 자동으로 끼워넣는 홍보·통계 코드를 걸러낸다.
   주석을 지울 때 주석 경계(-->)를 넘지 않도록 제한해, 파일 본문을 건드리지 않게 한다. */
function stripHostInjected(html){
  let out = html;
  out = out.replace(/<!--(?:(?!-->)[\s\S]){0,1000}?netlify\.new(?:(?!-->)[\s\S]){0,1000}?-->\s*/gi, '');
  out = out.replace(/<meta\s+name="hosting-provider"[^>]*>\s*/gi, '');
  out = out.replace(/<meta\s+name="netlify-deploy"[^>]*>\s*/gi, '');
  out = out.replace(/<script\b[^>]*src="\/\.netlify\/[^>]*>\s*<\/script>\s*/gi, '');
  return out;
}
/* 지금 내용을 담은 새 index.html 을 만든다 (데이터 구간만 교체) */
function buildHtmlFrom(tpl){
  const src = stripHostInjected(tpl);
  const i = src.indexOf(MARK_S), j = src.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 대화 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: src.slice(0,i) + block + src.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  toast('새 index.html 저장됨 · 버전 ' + built.version);
  if($('#adminOverlay').classList.contains('active')) renderAdminHome();
}
function exportHtml(){
  if(location.protocol.indexOf('http') !== 0){
    /* 파일로 직접 열었을 때는 “지금 열려 있는 화면의 코드”가 그대로 저장된다.
       기능이 추가된 파일을 새로 받은 뒤 새로고침 없이 내보내면 예전 코드로 되돌아가므로 한 번 확인한다. */
    confirmDialog(
      '지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침(F5) 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())),
      '만들기'
    );
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}
function exportData(){
  const payload = { app:'단서메신저', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '단서메신저_백업.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      if(!body || (!body.lists && !body.rooms)) throw new Error('bad');
      data = normalize(body);
      listIdx = 0;
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      save();               /* 현재 파일 버전으로 도장을 다시 찍어 저장 */
      toast('불러왔습니다');
      renderAdminHome(true);
    } catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

$('#btnBack').onclick = goBack;

/* 길게 누를 때 나오는 복사/검색/이미지 저장 메뉴 차단 (입력칸과 관리자 모드는 예외) */

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  }
}
/* 손님 모드에서는 전체화면 기능을 쓰지 않는다 (관리자일 때만 동작) */

/* 스크롤 시 오른쪽에 현재 날짜 표시 (카톡 방식) */
let floatDateTimer = null;
function onMessagesScroll(){
  const cont = $('#messages');
  const fd = $('#floatDate');
  if(!cont || !fd) return;
  const fdRect = fd.getBoundingClientRect();
  const refY = fdRect.top + fdRect.height/2;
  const rows = cont.querySelectorAll('.msg-row');
  let curDate = '';
  for(const r of rows){
    const rect = r.getBoundingClientRect();
    if(rect.bottom >= refY){ curDate = r.dataset.date || ''; break; }
  }
  if(!curDate){ fd.classList.remove('show'); return; }
  fd.querySelector('span').textContent = formatKoreanDate(curDate);
  fd.classList.add('show');
  clearTimeout(floatDateTimer);
  floatDateTimer = setTimeout(()=> fd.classList.remove('show'), 1200);
}
$('#messages').addEventListener('scroll', onMessagesScroll, {passive:true});

/* 제목 길게 눌러 관리자 진입 */
let pressTimer = null;
const listTitleEl = $('#listTitle');
function startPress(){ pressTimer = setTimeout(()=>{ openAdmin(); }, 5000); }
function cancelPress(){ clearTimeout(pressTimer); }
listTitleEl.addEventListener('mousedown', startPress);
listTitleEl.addEventListener('touchstart', startPress, {passive:true});
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> listTitleEl.addEventListener(ev, cancelPress));

/* ---------- 시작 ---------- */
/* 첫 화면 정하기
   - PC(넓은 화면)  : 편집용이므로 관리자 화면. 지점 잠금 없음.
   - 폰 · 처음      : 지점 고르기 → 그 지점 안에서 테마·인물 고르기
   - 폰 · 설정 끝난 뒤 : 손님 화면 */
let bootTries = 0;
function decideStartScreen(){
  if(!data) return;
  /* 창 크기를 아직 못 읽는 상태면 잠깐 기다렸다 다시 본다 */
  if(!window.innerWidth && bootTries < 20){ bootTries++; setTimeout(decideStartScreen, 200); return; }
  if(wideAdmin()){
    if(!isAdmin){ isAdmin = true; renderList(); openAdmin(!meId()); }
    return;
  }
  if(!lockedC1() && (data.tree||[]).length){ renderBranchPicker(); return; }
  fixListForBranch();
  fixListForMe();
  if(!meId()){ isAdmin = true; renderList(); openAdmin(true); return; }
  renderList();
}

(function boot(){
  /* 주소 끝에 ?reset=1 을 붙여 열면 폰에 저장된 내용과 캐시를 전부 지우고 파일 내용으로 시작한다 */
  let first = Promise.resolve();
  if(/[?&]reset=1/.test(location.search)){
    try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(LAST_KEY); localStorage.removeItem(VIEW_KEY); localStorage.removeItem(PAD_KEY); localStorage.removeItem(BRANCH_KEY); localStorage.removeItem(THEME_KEY); localStorage.removeItem(FONT_KEY); localStorage.removeItem(FACE_KEY); LEGACY_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
    /* 쿠키에 적어 둔 몫도 같이 지운다 — 안 지우면 되살아난다 */
    try{ [LAST_KEY, VIEW_KEY, BRANCH_KEY, THEME_KEY, FONT_KEY, FACE_KEY].forEach(k=>{ document.cookie = k + '=;path=/;max-age=0'; }); }catch(e){}
    try{ first = idbClear(); }catch(e){}
    try{ if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>{ if(isMyCache(k)) caches.delete(k); })); }catch(e){}
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(isMySW(r)) r.unregister(); }));
      }
    }catch(e){}
  }
  first.catch(()=>{}).then(load).then(d=>{
    data = d;
    /* 한 단계가 실패해도 앱은 뜨게 한다. 실패한 단계는 기록해 두고 화면 아래에 보여준다. */
    step('loadView', loadView);
    step('loadBranch', loadBranch);
    step('applyTheme', applyTheme);
    step('applySizes', applySizes);
    step('selectListFromUrl', selectListFromUrl);
    step('applyMeFlags', applyMeFlags);
    step('save', save);
    step('syncUrl', syncUrl);
    step('renderList', renderList);
    try{ askPersist().then(refreshQuota).then(checkOffline).then(()=>{ try{ refreshAdminInfo(); }catch(e){} }); }catch(e){}
    if(saveBlocked) setTimeout(()=>toast('저장된 내용을 읽지 못했습니다. 내용 보호를 위해 저장을 멈췄습니다 — 앱을 껐다 켜 주세요.'), 700);
    step('decideStartScreen', decideStartScreen);
    window.addEventListener('load', ()=> step('decideStartScreen', decideStartScreen));
    if(bootErrors.length) showBootError();
  }).catch(err=>{
    bootErrors.push({ where:'load', err:err });
    showBootError();
  });
})();

/* ---------- 시작 중 오류 처리 ----------
   한 군데가 실패해도 흰 화면으로 두지 않는다. 무엇이 어디서 실패했는지 화면에 보여준다. */
let bootErrors = [];
function step(name, fn){
  try{ fn(); }
  catch(e){
    bootErrors.push({ where:name, err:e });
    try{ console.error('[단서메신저] ' + name + ' 실패', e); }catch(x){}
  }
}
function showBootError(){
  const el = document.getElementById('chatList');
  if(!el) return;
  const lines = bootErrors.map(b=>{
    const e = b.err || {};
    const st = String(e.stack || '').split('\n').slice(0, 3).join('<br>');
    return '<b>' + esc(b.where) + '</b> — ' + esc(String(e.message || e.name || e))
         + (st ? '<br><span style="color:#b9c3cc">' + esc(st).replace(/&lt;br&gt;/g,'<br>') + '</span>' : '');
  });
  el.innerHTML = '<div class="empty" style="user-select:text;-webkit-user-select:text;text-align:left;padding:24px 16px">'
    + '<div style="text-align:center;margin-bottom:14px">내용을 불러오지 못했습니다.<br><br>'
    + '주소 끝에 <b>?reset=1</b> 을 붙여 다시 열어보세요.<br>'
    + '브라우저에서 <b>Ctrl+Shift+R</b> 로 새로고침해도 됩니다.</div>'
    + '<div style="font-size:10.5px;line-height:1.55;word-break:break-all">코드 버전 ' + esc(CODE_VERSION) + '<br><br>'
    + (lines.length ? lines.join('<br><br>') : '저장된 내용을 읽는 중 응답이 없습니다')
    + '</div></div>';
}
setTimeout(function(){
  if(!data){ bootErrors.push({ where:'load', err:{message:'저장된 내용을 읽는 중 응답이 없습니다'} }); showBootError(); }
}, 6000);

/* 서비스워커: 최신 파일 우선(network-first) + 예전 캐시 자동 삭제 */
if(!('serviceWorker' in navigator)) swState = '이 브라우저는 지원 안 함';
else if(location.protocol.indexOf('http') !== 0) swState = '파일 직접 열기 — 사용 불가';
else {
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    swState = '작동 중';
    applyAppIdentity();
    refreshAdminInfo();
  });
  navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
    .then(reg=>{
      swState = '등록됨 (제어 대기)';
      refreshAdminInfo();
      return navigator.serviceWorker.ready;
    })
    .then(()=>{
      swState = navigator.serviceWorker.controller ? '작동 중' : '등록됨 (새로고침하면 작동)';
      applyAppIdentity();
      refreshAdminInfo();
    })
    .catch(e=>{
      swState = '등록 실패: ' + ((e && e.message) ? e.message : String(e));
      refreshAdminInfo();
    });
}

setTimeout(function once(){
  if(!data){ setTimeout(once, 500); return; }    /* 저장분을 아직 읽는 중이면 기다린다 */
  checkForUpdate(false);
